        .btn-warning {
            color: #111;
            background-color: #ffc107;
            border-color: #ffc107;
        }
        .btn-warning:hover {
            background: #ffdf6d;
        }
        .btn {
            font: 15px Tahoma;
            margin-top: 3px;
            margin-bottom: 5px;
            padding: 2px 5px;
            text-decoration: none;
        }
        .btn {
            display: inline-block;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            border: 1px solid transparent;
            padding: .375rem .75rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: .25rem;
            transition: background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        }

        .btn-download {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
        }
        
        .btn-help {
            position: absolute;
            top: 10px;
            right: 80px;
            z-index: 2;

            color: #fff;
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-help:hover { background:#c82333 }

        /* Geçici duyuru bandı (DC arıza vb.) */
        .player-notice {
            position: absolute;
            top: 10px;
            right: 170px;
            z-index: 2;

            color: #1a1203;
            background: linear-gradient(135deg, #ffeb3b 0%, #ffc107 50%, #ff9800 100%);
            border: 2px solid #fff;
            font-weight: bold;
            padding: .375rem .75rem;
            font-size: 14px;
            line-height: 1.5;
            border-radius: .25rem;
            box-shadow: 0 0 14px rgba(255, 152, 0, 0.7), 0 4px 14px rgba(0,0,0,0.5);
            animation: player-notice-blink 1.5s ease-in-out infinite;
            white-space: nowrap;
        }
        @keyframes player-notice-blink {
            0%, 100% { box-shadow: 0 0 14px rgba(255, 152, 0, 0.7), 0 4px 14px rgba(0,0,0,0.5); }
            50%      { box-shadow: 0 0 28px rgba(244, 67, 54, 0.95), 0 4px 14px rgba(0,0,0,0.5); }
        }
        @media (max-width: 768px) {
            .player-notice {
                top: 55px;
                right: 10px;
                left: 10px;
                font-size: 11px;
                padding: .3rem .5rem;
                white-space: normal;
                text-align: center;
            }
        }

        .btn-sm {
            padding: .25rem .5rem;
            font-size: .875rem;
            border-radius: .2rem;
        }

        .btn-outline {
            color: #cacaca;
            background-color: transparent;
            border-color: #cacaca;
        }
        .btn-outline:hover {
            color: #fff;
            border-color: #fff;
        }

        .label {
            padding: 2px 6px;
        }

        .video-presets {
            position: absolute;
            bottom: 100%;
            z-index: 9;
        }

        @media (max-width: 768px) {
            .hidden-xs {
                display: none !important;
            }
            .btn-sm {
                padding: .10rem .3rem;
                font-size: .625rem;
            }
        }

            display: none;
        }

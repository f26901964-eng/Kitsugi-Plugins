# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: "Derlenecek eklenti dizinleri (boslukla ayrilmis). Bos birakilirsa sadece degisen dizinler derlenir."
        required: false
        default: ""
      teshis:
        description: "GECICI: canli site teshisi calistir (0 = kapali)."
        required: false
        default: "1"
  push:
    branches:
      - main
      - arena/d4c5fe64-kitsugi-plugins   # GECICI: is bitince kaldirilacak
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 2

      - name: "'build' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Lisansları
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: "GECICI: Canli Site Teshisi"
        if: github.event_name == 'push' || github.event.inputs.teshis != '0'
        run: |
          set +e
          : > /tmp/teshis.txt
          exec > >(tee -a /tmp/teshis.txt) 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"

          probe () {
            local url="$1"; local label="${2:-}"
            echo "==================== $label | $url"
            body=$(mktemp)
            code=$(curl -s -L --max-time 25 -A "$UA" \
              -H "Accept: text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: tr-TR,tr;q=0.9,en;q=0.8" \
              -w "%{http_code} %{url_effective}" -o "$body" "$url")
            echo "SONUC: $code | BOYUT: $(wc -c <"$body")"
            echo "--- ILK 1200 KARAKTER ---"
            head -c 1200 "$body" | tr -d '\000'
            echo
            echo "--- TITLE ---"
            grep -oiE "<title[^>]*>[^<]{0,150}" "$body" | head -2
            echo "--- ISARETLER ---"
            for kw in "Just a moment" "izinsiz" "İzinsiz" "cloudflare" "park" "satılık" "Satılık" "example.com" "used_slug" "searchcontent" "getserielistbychannel" "cKey" "__NEXT_DATA__" "secureData"; do
              c=$(grep -c -i -e "$kw" "$body" 2>/dev/null)
              [ "${c:-0}" != "0" ] && echo "  [$kw] x$c"
            done
            rm -f "$body"
            echo
          }

          probe "https://www.roketdizi.live/dizi/tur/aksiyon?&page=1" "ROKET-ana-sayfa"
          probe "https://roketdizi.live" "ROKET-kok"
          probe "https://ww38.roketdizi.live/" "ROKET-ww38-park"
          probe "https://roketdizi.org" "ROKET-org"
          probe "https://roketdizi.com" "ROKET-com"
          probe "https://roketdizi.net" "ROKET-net"
          probe "https://roketdizi.co" "ROKET-co"
          probe "https://roketdizi.xyz" "ROKET-xyz"
          probe "https://www.hdfilmcehennemi2.biz/" "HDFC2-biz"
          probe "https://www.hdfilmcehennemi2.site/" "HDFC2-site"
          probe "https://www.hdfilmcehennemi2.nl/" "HDFC2-nl"
          probe "https://www.hdfilmcehennemi.nl/" "HDFC-nl"
          probe "https://dizipal1588.com/yabanci-dizi-izle" "DIZIPAL1588"
          probe "https://selcukflix.com" "SELCUK-com"
          probe "https://selcukflix.net" "SELCUK-net"
          probe "https://selcukflix.co" "SELCUK-co"
          probe "https://backend.xprime.tv/servers" "XPRIME-backend"
          probe "https://api.themoviedb.org/3/movie/550?api_key=84259f99204eeb7d45c7e3d8e36c6123&language=tr-TR" "TMDB-key-testi"

          echo "==================== SELCUKFLIX ARAMA API (POST)"
          curl -s -i --max-time 25 -A "$UA" -X POST \
            -H "Accept: application/json, text/plain, */*" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://selcukflix.com/" \
            "https://selcukflix.com/api/bg/searchcontent?searchterm=squid" | head -c 2500
          echo
          echo "==================== ROKETDIZI dogrudan .life (WFW=bot blok) ===================="
          curl -s -o /tmp/roket_direct.html -w "SONUC: %{http_code} %{url_effective} BOYUT: %{size_download}\n" -L --max-time 25 -A "$UA" "https://roketdizi.life/dizi/tur/aksiyon"
          echo "==================== ROKETDIZI .life HAM HTML (translate proxy) ===================="
          T="https://roketdizi-life.translate.goog"
          Q="_x_tr_sl=tr&_x_tr_tl=en&_x_tr_hl=en"
          fetch_html () { curl -s -L --max-time 45 -A "$UA" "$1" -o "$2"; echo "  boyut: $(wc -c < "$2")"; }

          fetch_html "$T/dizi/tur/aksiyon?$Q" /tmp/r_dizi.html
          echo "--- DIZI SAYFASI: TITLE ---"; grep -oiE "<title[^>]{0,30}>[^<]{0,110}" /tmp/r_dizi.html | head -2
          echo "--- DIZI SAYFASI: KART HTML ORNEGI (watchlistitem civari 1600 karakter) ---"
          grep -o ".\{0,200\}watchlistitem.\{0,1400\}" /tmp/r_dizi.html | head -1
          echo
          echo "--- DIZI SAYFASI: CARD HREF ORNEKLERI ---"
          grep -oE "roketdizi-life\.translate\.goog(/[^\"?]{2,70})" /tmp/r_dizi.html | sort -u | head -14
          echo "--- DIZI SAYFASI: pageProps anahtarlari ---"
          grep -oE "\"pageProps\":\{[^}]{0,300}" /tmp/r_dizi.html | head -2
          echo "--- DIZI SAYFASI: secureData tipi (ilk 60 karakter) ---"
          grep -oE "\"secureData\":\"[^\"]{0,80}" /tmp/r_dizi.html | head -2
          echo

          echo "==================== ROKETDIZI FILM KATEGORISI ===================="
          fetch_html "$T/film-kategori/aksiyon?$Q" /tmp/r_film.html
          echo "--- TITLE ---"; grep -oiE "<title[^>]{0,30}>[^<]{0,110}" /tmp/r_film.html | head -2
          echo "--- EN SIK CLASS'LAR ---"
          grep -oE 'class="[^"]{0,90}"' /tmp/r_film.html | sort | uniq -c | sort -rn | head -14
          echo "--- KART HTML ORNEGI ---"
          grep -o ".\{0,200\}watchlistitem.\{0,1200\}" /tmp/r_film.html | head -1
          echo "--- FILM LINK ORNEKLERI ---"
          grep -oE "roketdizi-life\.translate\.goog(/[^\"?]{2,70})" /tmp/r_film.html | sort -u | grep -iE "film" | head -10
          echo

          echo "==================== ROKETDIZI ARAMA ===================="
          fetch_html "$T/arama?q=squid&$Q" /tmp/r_ara.html
          echo "--- TITLE ---"; grep -oiE "<title[^>]{0,30}>[^<]{0,110}" /tmp/r_ara.html | head -2
          echo "--- ARAMA SAYFASI ISARETLERI ---"
          for kw in "watchlistitem" "searchcontent" "arama" "Sonuc" "sonuc"; do
            c=$(grep -c -o -- "$kw" /tmp/r_ara.html 2>/dev/null); echo "  [$kw] x$c"
          done
          echo "==================== ROKETDIZI KART YAPISI (python) ===================="
          python3 - <<'PYEOF'
          import re, html
          def load(p):
              try:
                  return open(p, encoding="utf-8", errors="replace").read()
              except Exception as e:
                  return ""
          def block(txt, idx, before=200, after=2200):
              a = max(0, idx-before); b = min(len(txt), idx+after)
              return re.sub(r"\s+", " ", txt[a:b])
          dizi = load("/tmp/r_dizi.html"); film = load("/tmp/r_film.html")
          print("--- DIZI KARTI ---")
          k = dizi.find("watchlistitem-")
          print(block(dizi, k, 60, 2400) if k >= 0 else "  watchlistitem BULUNAMADI")
          print()
          print("--- DIZI SAYFASI SECICI SAYIMLARI ---")
          for sel, pat in [("span.bg-[#232323] (Mevcut konteyner)", r'<span class="bg-\[#232323\]'),
                           ("span.font-normal.line-clamp-1 (Mevcut baslik)", r'<span class="font-normal line-clamp-1'),
                           ("div.font-normal.line-clamp-1 (Yeni baslik?)", r'<div class="font-normal line-clamp-1'),
                           ("h2", r"<h2"), ("h4", r"<h4"), ("a.w-full", r'<a[^>]*class="w-full"')]:
              print(f"  {sel}: {len(re.findall(pat, dizi))}")
          print()
          print("--- FILM KARTI ---")
          m = re.search(r'<a[^>]*href="[^"]*/film/[^"]*"', film)
          print(block(film, m.start(), 400, 2200) if m else "  film anchor BULUNAMADI")
          print()
          print("--- FILM SAYFASI SECICI SAYIMLARI ---")
          for sel, pat in [("a.w-full (Mevcut konteyner)", r'<a[^>]*class="w-full"'),
                           ("div.w-full min-w-full ambilight", r'<div[^>]*ambilight'),
                           ("h2", r"<h2"), ("h4", r"<h4"),
                           ("a href film", r'href="[^"]*/film/[^"]*"')]:
              print(f"  {sel}: {len(re.findall(pat, film))}")
          print()
          print("--- ARAMA API IZLEME (dizi sayfasindan) ---")
          for kw in ["searchcontent", "api/bg"]:
              for mm in list(re.finditer(re.escape(kw), dizi))[:2]:
                  print(f"  [{kw}] ...{re.sub(chr(92)+'s+', ' ', dizi[max(0,mm.start()-260):mm.start()+300])}...")
          print()
          print("--- SAYFADAKI TUM API YOLLARI ---")
          paths = sorted(set(re.findall(r'/(?:api|_next/data)/[A-Za-z0-9_/\-\.]{2,60}', dizi)))
          for x in paths[:25]: print("  " + x)
          print()
          PYEOF

          echo "==================== ROKETDIZI DETAY SAYFASI ===================="
          fetch_html "$T/dizi/cutie-honey?$Q" /tmp/r_detay.html
          echo "--- TITLE ---"; grep -oiE "<title[^>]{0,30}>[^<]{0,110}" /tmp/r_detay.html | head -2
          echo "--- ISARETLER ---"
          for kw in "secureData" "openPlayer" "master.m3u8" "videosteam" "iframe" "sezon" "bolum" "episode"; do
            c=$(grep -c -o -- "$kw" /tmp/r_detay.html 2>/dev/null); echo "  [$kw] x$c"
          done
          echo "--- BOLUM/SEZON HTML ORNEGI ---"
          grep -oE ".{0,250}(sezon|bolum|episode).{0,350}" /tmp/r_detay.html | head -6
          echo
          echo "==================== ROKETDIZI ARAMA API (POST) ===================="
          echo "--- DOGRUDAN POST ---"
          curl -s -o /tmp/r_api1.txt -w "  kod: %{http_code} boyut: %{size_download}\n" --max-time 25 -X POST \
            -A "$UA" -H "Accept: application/json, text/plain, */*" -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://roketdizi.life/" "${mainUrl:-https://roketdizi.life}/api/bg/searchcontent?searchterm=squid"
          head -c 220 /tmp/r_api1.txt; echo
          echo "--- GET (translate proxy) ---"
          curl -s -o /tmp/r_api2.txt -w "  kod: %{http_code} boyut: %{size_download}\n" --max-time 25 -A "$UA" "$T/api/bg/searchcontent?searchterm=squid&$Q"
          head -c 220 /tmp/r_api2.txt; echo
          echo "--- GET (dogrudan) ---"
          curl -s -o /tmp/r_api3.txt -w "  kod: %{http_code} boyut: %{size_download}\n" --max-time 25 -A "$UA" -H "X-Requested-With: XMLHttpRequest" "https://roketdizi.life/api/bg/searchcontent?searchterm=squid"
          head -c 220 /tmp/r_api3.txt; echo
          echo

          echo "==================== ROKETDIZI ARAMA FORMU (input adi) ===================="
          python3 - <<'PYEOF3'
          import re
          T = "https://roketdizi-life.translate.goog"; Q = "_x_tr_sl=tr&_x_tr_tl=en&_x_tr_hl=en"
          t = open("/tmp/r_dizi.html", encoding="utf-8", errors="replace").read()
          k = t.find("data-action=\"/bg/searchcontent\"")
          if k < 0: k = t.find("/bg/searchcontent")
          if k >= 0:
              blk = re.sub(r"\s+", " ", t[max(0, k-300):k+1100])
              print("FORM BLOGU:", blk)
              for m in re.finditer(r'name="([^"]{1,40})"', blk): print("  input adi:", m.group(1))
          else:
              print("  form bulunamadi")
          print()
          print("--- 'Daha Fazla' / yukleme isaretleri (dizi kategorisi) ---")
          for kw in ["Daha Fazla", "loadMore", "load-more", "pagination", "infinite", "sayfala"]:
              c = t.count(kw); print(f"  [{kw}] x{c}")
          for m in list(re.finditer("Daha Fazla", t))[:2]:
              print("   >>> " + re.sub(r"\s+", " ", t[max(0,m.start()-420):m.start()+120]))
          print()
          print("--- SAYFA 2 TESTI (dizi/tur/aksiyon?page=2) ---")
          import subprocess
          def get(u):
              return subprocess.run(["curl","-s","-L","--max-time","40","-A",
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36", u],
                  capture_output=True, text=True).stdout
          p1 = t
          p2 = get(f"{T}/dizi/tur/aksiyon?page=2&{Q}")
          def firstcard(x):
              m = re.search(r'watchlistitem.*?<a href="([^"]+)"', x, re.S)
              n = re.search(r'watchlistitem.*?<span class="font-normal line-clamp-1[^>]*>([^<]{1,80})', x, re.S)
              cards = len(re.findall(r"watchlistitem-", x))
              return (m.group(1)[:80] if m else None, n.group(1) if n else None, cards)
          print("  SAYFA1:", firstcard(p1), f"boyut={len(p1)}")
          print("  SAYFA2:", firstcard(p2), f"boyut={len(p2)}")
          print("  AYNI MI:", firstcard(p1)[1] == firstcard(p2)[1])
          print()
          print("--- JS CHUNK: TUM API YUZEYI (translate-proxy) ---")
          import re as _re, subprocess as _sp
          _chunks = _re.findall(r'src="(/_next/static/chunks/[^"]+\.js)"', t)
          _apis, _pages = {}, {}
          for _c in _chunks:
              _js = _sp.run(["curl","-s","-L","--max-time","30","-A",
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
                  f"{T}{_c}?{Q}"], capture_output=True, text=True).stdout
              if len(_js) < 200: continue
              for _m in _re.finditer(r'"(/api/[A-Za-z0-9_/\-]{2,60})"', _js):
                  _apis.setdefault(_m.group(1), _c)
              for _kw in ["getContents", "getContent", "pageIndex", "pageNumber"]:
                  for _m in list(_re.finditer(_re.escape(_kw), _js))[:1]:
                      _pages.setdefault(_kw, _re.sub(r"\s+", " ", _js[max(0,_m.start()-300):_m.start()+340]))
          print("  --- SITEDE KULLANILAN API YOLLARI ---")
          for _k in sorted(_apis): print("   " + _k)
          print("  --- SAYFALAMA IZLERI ---")
          for _k, _v in _pages.items(): print(f"   [{_k}] {_v[:460]}")
          PYEOF3
          echo "==================== ROKETDIZI ARAMA ISTEGI DETAYI (JS) ===================="
          python3 - <<'PYEOF5'
          import re, subprocess
          T = "https://roketdizi-life.translate.goog"; Q = "_x_tr_sl=tr&_x_tr_tl=en&_x_tr_hl=en"
          t = open("/tmp/r_dizi.html", encoding="utf-8", errors="replace").read()
          chunks = re.findall(r'src="(/_next/static/chunks/[^"]+\.js)"', t)
          keys = ["searchAjaxCallback", "URLSearchParams", "withCredentials", "baseURL",
                  "XMLHttpRequest", "searchContent"]
          found = {}
          hosts = {}
          for c in chunks:
              js = subprocess.run(["curl","-s","-L","--max-time","30","-A",
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
                  f"{T}{c}?{Q}"], capture_output=True, text=True).stdout
              if len(js) < 200: continue
              for h in re.findall(r'https://[A-Za-z0-9.-]+\.(?:com|life|net|io|online|me|xyz|to)/[A-Za-z0-9_/-]{0,30}', js):
                  if h not in hosts: hosts[h] = 0
                  hosts[h] += 1
              for k in keys:
                  if k in found: continue
                  m = re.search(re.escape(k), js)
                  if m:
                      found[k] = f"[{c}] " + re.sub(r"\s+", " ", js[max(0,m.start()-700):m.start()+900])
          for k in keys:
              print(f"  --- {k} ---")
              print("   " + found.get(k, "BULUNAMADI")[:1500])
          print("  --- SITEDE GECEN HOSTLAR ---")
          for h, n in sorted(hosts.items(), key=lambda x: -x[1])[:12]: print(f"   {h}  x{n}")
          print()
          PYEOF5
          echo "==================== DIZIPAL API (POST)"
          curl -s -i --max-time 25 -A "$UA" -X POST \
            -H "Accept: application/json, text/javascript, */*; q=0.01" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://dizipal1588.com/yabanci-dizi-izle" \
            --data "cKey=c61f91c5141d178450934fe81c0a2029&cValue=MTc4NDQwNzIwMDhkMzJhNTc1YzUwOGU1ZjQwMjdjMjIyOWVjOGVhMTcwNGQyM2FjODM2YTI4YTU0NjUyMjI2ZmVjMzFkYzBkMWQyMWY4YzdiNA==&curPage=1&channelId=1&languageId=2,3,4&slug=netflix" \
            "https://dizipal1588.com/bg/getserielistbychannel" | head -c 1800
          echo

      - name: Degisen Eklentileri Bul ve Derle
        run: |
          cd $GITHUB_WORKSPACE/src

          # Manuel tetiklemede (workflow_dispatch) eklenti listesi elle verilebilir;
          # aksi halde onceki commit ile karsilastirilir. Boylece kaynagi olup hic
          # derlenmemis eklentiler de derlenebilir (or. Filmmirasim, FilmIzlesene).
          MANUAL="${{ github.event.inputs.plugins }}"
          # GECICI: kendi gelistirme branch'imizde push ile tetiklenen kosularda
          # varsayilan eklenti listesini derle (teshis icin).
          if [ -n "$MANUAL" ]; then
            CHANGED="$MANUAL"
            echo "Manuel derleme listesi: $CHANGED"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            CHANGED="DiziPal DiziPalOriginal SelcukFlix HDFilmCehennemi RoketDizi XPrime NeonSpor __New AnimeAV DiziKorea Dizilla Dramaizle FullHDFilm FullHDFilmizlesene HDFilmIzle JetFilmizle KultFilmler RecTV SetFilmIzle SezonlukDizi SinemaCX TRasyalog WFilmİzle WebteIzle YabanciDizi Tafdi UgurFilm DiziFilmSiteleri NetflixMirror F1FullRaces FilmIzleIlk FilmKovasi Filmİzlesene FullHDFilmİzlede KoreanTurk SuperFilmGeldi TokyBook HDFilmSitesi DiziGom HDFilmCehennemi2"
            echo "GECICI teshis listesi: $CHANGED"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oP '^[^/]+' | sort -u)
            echo "Degisen klasorler: $CHANGED"
          fi

          # Sadece gercek plugin klasorlerini sec (build.gradle.kts'i olanlar)
          PLUGINS_TO_BUILD=""
          for dir in $CHANGED; do
            if [ -f "$dir/build.gradle.kts" ]; then
              PLUGINS_TO_BUILD="$PLUGINS_TO_BUILD :$dir:make"
              echo "Derlenecek plugin: $dir"
            fi
          done

          if [ -z "$PLUGINS_TO_BUILD" ]; then
            echo "Hicbir plugin degismemis, islem atlaniyor."
            exit 0
          fi

          chmod +x gradlew

          # Sadece degisen pluginleri derle
          set +e
          ./gradlew $PLUGINS_TO_BUILD makePluginsJson --stacktrace > /tmp/build.txt 2>&1
          RC=$?
          tail -60 /tmp/build.txt
          {
            echo ""
            echo "################ GRADLE CIKTI (RC=$RC) ################"
            echo "--- HATA SATIRLARI ---"
            grep -nE "^e: |error:|FAILURE:|Execution failed|Could not|> Task .*FAILED|Caused by" /tmp/build.txt | head -100
            echo "--- SON 150 SATIR ---"
            tail -150 /tmp/build.txt
          } >> /tmp/teshis.txt
          [ "$RC" != "0" ] && exit $RC
          set -e

          # ── SIRA KRITIK (2026-10-12 duzeltmesi) ──────────────────────────────
          # ONCE repodaki prebuilt kopyalar, SONRA derlenen dosyalar kopyalanir.
          # Onceki sirada derlenen dosya (or. DiziPal v113) sonra gelen bayat
          # prebuilt kopyasiyla (v102) UZERINE YAZILIYORDU: kullanici listede v113
          # goruyor ama eski kodu indiriyordu.
          #
          # Prebuilt (hazir) eklentileri kopyala.
          # DIKKAT: plugins.json'daki URL'ler `builds/prebuilt/<ad>.cs3` bicimindedir;
          # bu yuzden kopya da `builds/prebuilt/` altina yapilmalidir.
          mkdir -p $GITHUB_WORKSPACE/builds/prebuilt
          cp prebuilt/*.cs3 $GITHUB_WORKSPACE/builds/prebuilt/ 2>/dev/null || true
          cp prebuilt/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

          # Derlenen cs3 dosyalarini kopyala — prebuilt kopyalarinin UZERINE yazar.
          for dir in $CHANGED; do
            CS3="$dir/build/$dir.cs3"
            if [ -f "$CS3" ]; then
              cp "$CS3" $GITHUB_WORKSPACE/builds/
              # Ayni isimdeki bayat prebuilt kopyasi da guncellensin (tutarlilik).
              cp "$CS3" $GITHUB_WORKSPACE/builds/prebuilt/
              echo "Kopyalandi (prebuilt'in uzerine): $dir.cs3"
            fi
          done

          # Manifest guncelle
          python3 merge_plugins.py
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: "GECICI: Eksik cs3 Dosyalarini Onar"
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cd $GITHUB_WORKSPACE/src
          echo "" >> /tmp/teshis.txt
          echo "################ EKSIK cs3 ONARIMI ################" >> /tmp/teshis.txt
          python3 - >> /tmp/teshis.txt 2>&1 <<'PYEOF8'
          import json, os, subprocess, hashlib, glob
          ws = os.environ.get("GITHUB_WORKSPACE", ".")
          bdir = os.path.join(ws, "builds")
          var = {os.path.basename(f) for f in glob.glob(os.path.join(bdir, "**", "*.cs3"), recursive=True)}
          pre_path = "prebuilt_plugins.json"
          pre = json.load(open(pre_path, encoding="utf-8"))
          base = "https://raw.githubusercontent.com/" + os.environ.get("GITHUB_REPOSITORY", "f26901964-eng/Kitsugi-Plugins") + "/builds"
          onarildi, basarisiz = [], []
          for p in pre:
              url = p.get("url") or ""
              if not url: continue
              fn = url.split("?")[0].rsplit("/", 1)[-1]
              if fn in var: continue
              dest_dir = os.path.join(bdir, "prebuilt"); os.makedirs(dest_dir, exist_ok=True)
              dest = os.path.join(dest_dir, fn)
              # Aday URL listesi: orijinal (bosluk kodlanmis) + ayna depolar + bilinen ad varyantlari
              MIRROR = "https://raw.githubusercontent.com/Sertel392/Makotogecici/main/"
              ALIAS = {"CizgiveDizi.cs3": "CizgiVeDizi.cs3", "Kanal 7.cs3": "Kanal7.cs3"}
              cands = []
              if " " in url: cands.append(url.replace(" ", "%20"))
              cands.append(url)
              names = [fn, fn.replace(" ", "")] + ([ALIAS[fn]] if fn in ALIAS else [])
              for nm in names:
                  cands.append(MIRROR + nm.replace(" ", "%20"))
              code = "000"
              print(f"  ? {fn} icin {len(cands)} aday denenecek")
              for cand in cands:
                  r = subprocess.run(["curl", "-s", "-L", "--max-time", "60", "-o", dest, "-w", "%{http_code}", cand],
                                     capture_output=True, text=True)
                  code = (r.stdout or "").strip()
                  print(f"      {code}  {cand[:110]}  ({os.path.getsize(dest) if os.path.exists(dest) else 0} bayt)")
                  if code.startswith("2") and os.path.exists(dest) and os.path.getsize(dest) > 1000:
                      print(f"  + {fn} <- {cand}"); break
                  if os.path.exists(dest):
                      try: os.remove(dest)
                      except OSError: pass
              if code.startswith("2") and os.path.exists(dest) and os.path.getsize(dest) > 1000:
                  h = hashlib.sha256(open(dest, "rb").read()).hexdigest()
                  p["url"] = base + "/prebuilt/" + fn
                  p["fileHash"] = "sha256-" + h
                  p["fileSize"] = os.path.getsize(dest)
                  var.add(fn)
                  onarildi.append(fn)
              else:
                  basarisiz.append(f"{fn} ({code})")
                  if os.path.exists(dest): os.remove(dest)
          if onarildi:
              json.dump(pre, open(pre_path, "w", encoding="utf-8"), indent=4, ensure_ascii=False)
          print(f"ONARILDI ({len(onarildi)}): " + ", ".join(onarildi))
          print(f"ALINAMADI ({len(basarisiz)}): " + ", ".join(basarisiz))
          PYEOF8
      - name: "GECICI: Eklenti Site Saglik Taramasi"
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cd $GITHUB_WORKSPACE/src
          if [ ! -f .github/gecici_denetim.tsv ]; then echo "Denetim listesi yok."; exit 0; fi
          echo "" >> /tmp/teshis.txt
          echo "################ EKLENTI SITE SAGLIK TARAMASI ################" >> /tmp/teshis.txt
          python3 - >> /tmp/teshis.txt <<'PYEOF9'
          import concurrent.futures as cf, subprocess, re, collections
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          rows = [l.split("\t") for l in open(".github/gecici_denetim.tsv", encoding="utf-8") if l.strip()]
          def probe(row):
              name, url = row[0], (row[1].strip() if len(row) > 1 else "")
              if not url: return (name, "", "?", "url yok")
              try:
                  r = subprocess.run(["curl", "-s", "-o", "/dev/null", "-L", "--max-time", "20",
                                      "-A", UA, "-w", "%{http_code}|%{url_effective}", url],
                                     capture_output=True, text=True, timeout=40).stdout.strip()
                  code, _, eff = r.partition("|")
              except Exception:
                  code, eff = "000", ""
              return (name, url, code, eff)
          with cf.ThreadPoolExecutor(max_workers=24) as ex:
              res = list(ex.map(probe, rows))
          def kind(code):
              if code == "000": return "ERISILEMEDI"
              if code.startswith("2"): return "OK"
              if code.startswith("3"): return "YONLENDIRME"
              if code in ("401","403","405","429","503"): return "ENGELLI(olabilir canli)"
              return "HATA " + code
          groups = collections.defaultdict(list)
          for n, u, c, e in res: groups[kind(c)].append((n, u, c, e))
          print("TOPLAM:", len(res))
          for k in sorted(groups, key=lambda x: -len(groups[x])):
              print(f"  {k}: {len(groups[k])}")
          print()
          for k in ("ERISILEMEDI", "HATA 404", "ENGELLI(olabilir canli)", "YONLENDIRME"):
              if k not in groups: continue
              print(f"--- {k} ({len(groups[k])}) ---")
              for n, u, c, e in sorted(groups[k]):
                  tail = "" if e == u else f"  -> {e[:80]}"
                  print(f"  {n:24} {c:4} {u[:60]}{tail}")
              print()
          print("--- OK OLANLAR (ilk 40) ---")
          oks = sorted(groups.get("OK", []))
          print("  " + ", ".join(n for n, *_ in oks[:40]))
          print(f"  ... toplam {len(oks)} OK")
          PYEOF9
      - name: "GECICI: Domain Aday Testi + Dex Eklenti Eslesmesi"
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cd $GITHUB_WORKSPACE/src
          {
            echo ""
            echo "################ DOMAIN ADAY TESTI ################"
          } >> /tmp/teshis.txt
          python3 - >> /tmp/teshis.txt <<'PYEOF7'
          import json, subprocess, concurrent.futures as cf
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          cands = json.load(open(".github/gecici_domain_probe.json", encoding="utf-8"))
          jobs = [(ad, u) for ad, urls in cands.items() for u in urls]
          def probe(job):
              ad, u = job
              try:
                  r = subprocess.run(["curl","-s","-o","/dev/null","-L","--max-time","20","-A",UA,
                                      "-w","%{http_code}|%{url_effective}", u],
                                     capture_output=True, text=True, timeout=35).stdout.strip()
                  code, _, eff = r.partition("|")
              except Exception:
                  code, eff = "000", ""
              return (ad, u, code, eff)
          with cf.ThreadPoolExecutor(max_workers=16) as ex:
              res = list(ex.map(probe, jobs))
          cur = None
          for ad, u, code, eff in sorted(res):
              if ad != cur: print(f"  --- {ad} ---"); cur = ad
              park = " (PARK?)" if any(k in eff for k in ("ww38","ww80","park","sedo","above.com")) else ""
              print(f"    {code}  {u[:52]:52} -> {eff[:60]}{park}")

          print()
          print("################ DEX EKLENTI <-> UYGULAMA TABLOSU ################")
          import os, re, zipfile, glob
          bdir = os.environ.get("GITHUB_WORKSPACE", ".") + "/builds"
          tab = {}
          try:
              fx = json.load(open("domain_fixes.json", encoding="utf-8"))
              tab.update({k.lower(): v for k, v in fx.get("domains", {}).items()})
          except Exception:
              fx = {}
          def fold(s):
              s = s.lower()
              for a,b in (("\u0130","i"),("\u0131","i"),("\u015f","s"),("\u011f","g"),("\u00fc","u"),("\u00f6","o"),("\u00e7","c")):
                  s = s.replace(a,b)
              return s.replace(" ","").replace("_","").replace("-","")
          tabf = {fold(k): v for k, v in tab.items()}
          SAFE = ("original","orijinal","plus","pro","tv","hd","2","sitesi","provider","official")
          eksik_dex = []
          for cs3 in sorted(glob.glob(bdir + "/**/*.cs3", recursive=True)):
              name = os.path.basename(cs3)[:-4]
              try:
                  with zipfile.ZipFile(cs3) as z:
                      man = json.loads(z.read("manifest.json").decode("utf-8","ignore"))
              except Exception:
                  continue
              pname = man.get("name") or name
              k = fold(pname)
              hit = tabf.get(k)
              if hit is None:
                  for suf in SAFE:
                      if k.endswith(suf) and k[:-len(suf)] in tabf:
                          hit = tabf[k[:-len(suf)]]; break
              if hit: print(f"    ✓ {pname:24} -> {hit}")
              else: eksik_dex.append(pname)
          print()
          print(f"  UYGULAMA TABLOSUNDA KARSILIGI OLMAYAN ({len(eksik_dex)}): " + ", ".join(eksik_dex[:30]))
          PYEOF7

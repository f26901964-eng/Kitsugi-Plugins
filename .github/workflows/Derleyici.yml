# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: "Derlenecek eklenti dizinleri (boslukla ayrilmis). Bos birakilirsa sadece degisen dizinler derlenir."
        required: false
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 2

      - name: "'build' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Lisansları
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Degisen Eklentileri Bul ve Derle
        run: |
          cd $GITHUB_WORKSPACE/src

          # Manuel tetiklemede (workflow_dispatch) eklenti listesi elle verilebilir;
          # aksi halde onceki commit ile karsilastirilir. Boylece kaynagi olup hic
          # derlenmemis eklentiler de derlenebilir (or. Filmmirasim, FilmIzlesene).
          MANUAL="${{ github.event.inputs.plugins }}"
          if [ -n "$MANUAL" ]; then
            CHANGED="$MANUAL"
            echo "Manuel derleme listesi: $CHANGED"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oP '^[^/]+' | sort -u)
            echo "Degisen klasorler: $CHANGED"
          fi

          # Sadece gercek plugin klasorlerini sec (build.gradle.kts'i olanlar)
          PLUGINS_TO_BUILD=""
          for dir in $CHANGED; do
            if [ -f "$dir/build.gradle.kts" ]; then
              PLUGINS_TO_BUILD="$PLUGINS_TO_BUILD :$dir:make"
              echo "Derlenecek plugin: $dir"
            fi
          done

          if [ -z "$PLUGINS_TO_BUILD" ]; then
            echo "Hicbir plugin degismemis, islem atlaniyor."
            exit 0
          fi

          chmod +x gradlew

          # Sadece degisen pluginleri derle
          ./gradlew $PLUGINS_TO_BUILD makePluginsJson

          # Derlenen cs3 dosyalarini builds branch'ine kopyala
          for dir in $CHANGED; do
            CS3="$dir/build/$dir.cs3"
            if [ -f "$CS3" ]; then
              cp "$CS3" $GITHUB_WORKSPACE/builds/
              echo "Kopyalandi: $dir.cs3"
            fi
          done

          # Prebuilt (hazir) eklentileri kopyala.
          # DIKKAT: plugins.json'daki URL'ler `builds/prebuilt/<ad>.cs3` bicimindedir;
          # bu yuzden kopya da `builds/prebuilt/` altina yapilmalidir. Daha once kok
          # dizine kopyalandigi icin manifest ile dosya konumu uyusmuyor, indirme 404
          # aliyordu (or. WFilmİzle.cs3).
          mkdir -p $GITHUB_WORKSPACE/builds/prebuilt
          cp prebuilt/*.cs3 $GITHUB_WORKSPACE/builds/prebuilt/ 2>/dev/null || true
          cp prebuilt/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

          # Manifest guncelle
          python3 merge_plugins.py
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yukle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --staged --quiet && echo "Degisiklik yok, push atlanıyor." && exit 0
          git commit --amend -m "$GITHUB_SHA 'nın Derlenmesi"
          git push --force

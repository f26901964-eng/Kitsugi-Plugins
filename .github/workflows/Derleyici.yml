# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: "Derlenecek eklenti dizinleri (boslukla ayrilmis). Bos birakilirsa sadece degisen dizinler derlenir."
        required: false
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 2

      - name: "'build' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Lisansları
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Degisen Eklentileri Bul ve Derle
        run: |
          cd $GITHUB_WORKSPACE/src

          # Manuel tetiklemede (workflow_dispatch) eklenti listesi elle verilebilir;
          # aksi halde onceki commit ile karsilastirilir.
          MANUAL="${{ github.event.inputs.plugins }}"
          if [ -n "$MANUAL" ]; then
            CHANGED="$MANUAL"
            echo "Manuel derleme listesi: $CHANGED"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oP '^[^/]+' | sort -u || true)
            echo "Degisen klasorler: $CHANGED"
          fi

          # enabled_plugins.txt = uygulamada gorunecek TEK kaynaklar.
          # Burada olmayan eklentiler derlenmez; kaynaklari SILINMEZ, sadece devre disi.
          ENABLED=""
          if [ -f enabled_plugins.txt ]; then
            ENABLED=$(grep -vE '^[[:space:]]*(#|$)' enabled_plugins.txt | tr -d '\r' | sed 's/[[:space:]]*$//' || true)
            echo "Aktif eklenti listesi:"; echo "$ENABLED"
          fi

          # 1) Hazir (prebuilt) eklentileri ONCE kopyala.
          #    DIKKAT 1: plugins.json'daki URL'ler `builds/prebuilt/<ad>.cs3` bicimindedir;
          #    bu yuzden kopya hem kok dizine hem `builds/prebuilt/` altina yapilir.
          #    DIKKAT 2: kopyalama SURUM KARSILASTIRMALI yapilir. Eskiden kosulsuz
          #    `cp` kullaniliyordu; derleme yapilmayan bir commit'te builds/ altindaki
          #    taze .cs3 dosyasi prebuilt/ altindaki eski surumle eziliyor ve yayindaki
          #    surum geriye dusuyordu (AnimeciX 23 -> 21). stage_prebuilt.py yalnizca
          #    daha yeni surumu kopyalar.
          python3 tools/stage_prebuilt.py prebuilt "$GITHUB_WORKSPACE/builds"

          # 2) Sadece gercek plugin klasorlerini sec (build.gradle.kts'i olanlar)
          PLUGINS_TO_BUILD=""
          BUILT_DIRS=""
          for dir in $CHANGED; do
            if [ ! -f "$dir/build.gradle.kts" ]; then
              continue
            fi
            if [ -n "$ENABLED" ] && ! printf '%s\n' "$ENABLED" | grep -qxF "$dir"; then
              echo "Devre disi (enabled_plugins.txt'de yok), atlandi: $dir"
              continue
            fi
            PLUGINS_TO_BUILD="$PLUGINS_TO_BUILD :$dir:make"
            BUILT_DIRS="$BUILT_DIRS $dir"
            echo "Derlenecek plugin: $dir"
          done

          if [ -n "$PLUGINS_TO_BUILD" ]; then
            chmod +x gradlew

            # Sadece degisen ve aktif pluginleri derle
            ./gradlew $PLUGINS_TO_BUILD makePluginsJson

            # 2b) Regresyon testleri (varsa) — bozuk kod yayinlanmasin.
            TEST_TASKS=""
            for dir in $BUILT_DIRS; do
              if [ -d "$dir/src/test" ]; then
                TEST_TASKS="$TEST_TASKS :$dir:test"
                echo "Test edilecek: $dir"
              fi
            done
            if [ -n "$TEST_TASKS" ]; then
              ./gradlew $TEST_TASKS
            fi

            # 3) Derlenen cs3 dosyalari prebuilt kopyalarinin UZERINE yazilir.
            for dir in $BUILT_DIRS; do
              CS3="$dir/build/$dir.cs3"
              if [ -f "$CS3" ]; then
                cp "$CS3" $GITHUB_WORKSPACE/builds/
                echo "Kopyalandi: $dir.cs3"
              fi
            done
          else
            # ONEMLI: Derleme olmasa bile manifest yeniden uretilmeli; aksi halde
            # enabled_plugins.txt degisikligi builds/plugins.json'a hic yansimaz
            # (uygulamada eski 166+ eklenti listesi gorunmeye devam eder).
            echo "Derlenecek aktif/degismis plugin yok; sadece manifest guncellenecek."
          fi

          # 4) Manifest guncelle (enabled_plugins.txt filtresi + hash/surum senkronu)
          python3 merge_plugins.py
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          cp build/repo.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yukle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --staged --quiet && echo "Degisiklik yok, push atlanıyor." && exit 0
          git commit --amend -m "$GITHUB_SHA 'nın Derlenmesi"
          git push --force

# Sadece DERLEME DOĞRULAMASI yapar — hiçbir şey yayınlamaz (builds dalına dokunmaz).
# Amaç: PR'larda Kotlin derleme hatalarını merge edilmeden önce görmek.
# Hata olursa derleme logunun son kısmı PR'a yorum olarak yazılır (log indirme
# erişimi kısıtlı ortamlarda da hata görülebilsin diye).
name: Derleme Testi

on:
  pull_request:
    paths:
      - "**/*.kt"
      - "**/build.gradle.kts"
      - "**/src/test/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "enabled_plugins.txt"
  workflow_dispatch:
    inputs:
      plugins:
        description: "Boşsa tüm etkin eklentiler; örnek: FilmEkseni HDFilmDelisi"
        required: false
        default: ""

jobs:
  Derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Lisansları
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Etkin Eklentileri Derle
        id: build
        env:
          REQUESTED_PLUGINS: ${{ inputs.plugins }}
        run: |
          chmod +x gradlew

          ENABLED=""
          if [ -f enabled_plugins.txt ]; then
            ENABLED=$(grep -vE '^[[:space:]]*(#|$)' enabled_plugins.txt | tr -d '\r' | sed 's/[[:space:]]*$//' || true)
          fi
          if [ -n "$REQUESTED_PLUGINS" ]; then
            ENABLED="$REQUESTED_PLUGINS"
            echo "Manuel derleme listesi: $ENABLED"
          fi

          TASKS=""
          for dir in $ENABLED; do
            if [ -f "$dir/build.gradle.kts" ]; then
              TASKS="$TASKS :$dir:make"
              echo "Derlenecek: $dir"
            fi
          done

          if [ -z "$TASKS" ]; then
            echo "Derlenecek etkin eklenti bulunamadi."
            exit 0
          fi

          set +e
          ./gradlew --no-daemon $TASKS makePluginsJson > /tmp/build.log 2>&1
          STATUS=$?
          set -e

          # Konsola da yaz (normal ortamlarda görünsün)
          tail -n 120 /tmp/build.log

          if [ $STATUS -ne 0 ]; then
            {
              echo "### ❌ Derleme başarısız"
              echo ""
              echo '```'
              grep -nE "^e: |error:|Unresolved reference|Compilation error|FAILURE:|What went wrong|Caused by:" /tmp/build.log | head -n 60
              echo '```'
              echo ""
              echo "<details><summary>Logun sonu</summary>"
              echo ""
              echo '```'
              tail -n 100 /tmp/build.log
              echo '```'
              echo "</details>"
            } > /tmp/comment.md
            echo "comment=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ Derleme başarılı"

      - name: "Birim Testleri (regresyon)"
        id: test
        env:
          REQUESTED_PLUGINS: ${{ inputs.plugins }}
        run: |
          chmod +x gradlew

          TEST_PLUGINS=$(grep -vE '^[[:space:]]*(#|$)' enabled_plugins.txt | tr -d '\r' | sed 's/[[:space:]]*$//' || true)
          if [ -n "$REQUESTED_PLUGINS" ]; then
            TEST_PLUGINS="$REQUESTED_PLUGINS"
          fi
          TEST_TASKS=""
          for dir in $TEST_PLUGINS; do
            if [ -d "$dir/src/test" ]; then
              TEST_TASKS="$TEST_TASKS :$dir:test"
              echo "Test edilecek: $dir"
            fi
          done

          if [ -z "$TEST_TASKS" ]; then
            echo "Test dizini olan etkin eklenti yok."
            exit 0
          fi

          set +e
          ./gradlew --no-daemon $TEST_TASKS > /tmp/test.log 2>&1
          STATUS=$?
          set -e

          tail -n 120 /tmp/test.log

          if [ $STATUS -ne 0 ]; then
            {
              echo "### ❌ Birim testleri başarısız"
              echo ""
              echo '```'
              grep -nE "FAILED|expected:|AssertionError|error:|^e: |FAILURE:|What went wrong" /tmp/test.log | head -n 60
              echo '```'
              echo ""
              echo "<details><summary>Logun sonu</summary>"
              echo ""
              echo '```'
              tail -n 100 /tmp/test.log
              echo '```'
              echo "</details>"
            } > /tmp/comment.md
            echo "comment=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ Birim testleri başarılı"

      - name: Derlenen eklentileri indirilebilir artifact olarak ekle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kitsugi-Plugins-${{ github.run_id }}
          path: |
            FilmEkseni/build/FilmEkseni.cs3
            HDFilmDelisi/build/HDFilmDelisi.cs3
          if-no-files-found: warn
          retention-days: 14

      - name: İstenen Drive aktarımı için derlenen paketleri geçici olarak PR dalına koy
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('.drive-transfer-request') != ''
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -s FilmEkseni/build/FilmEkseni.cs3
          test -s HDFilmDelisi/build/HDFilmDelisi.cs3
          mkdir -p .drive-transfer
          cp FilmEkseni/build/FilmEkseni.cs3 .drive-transfer/FilmEkseni.cs3
          cp HDFilmDelisi/build/HDFilmDelisi.cs3 .drive-transfer/HDFilmDelisi.cs3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .drive-transfer/FilmEkseni.cs3 .drive-transfer/HDFilmDelisi.cs3
          if git diff --cached --quiet; then
            echo "Paketler zaten aktarım dizininde."
            exit 0
          fi
          git commit -m "temp: stage validated plugins for requested Drive upload"
          git push origin "HEAD:${PR_BRANCH}"

      - name: Hatayı PR'a Yaz
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md || true
          fi

# Sadece DERLEME DOĞRULAMASI yapar — hiçbir şey yayınlamaz (builds dalına dokunmaz).
# Amaç: PR'larda Kotlin derleme hatalarını merge edilmeden önce görmek.
# Hata olursa derleme logunun son kısmı PR'a yorum olarak yazılır (log indirme
# erişimi kısıtlı ortamlarda da hata görülebilsin diye).
name: Derleme Testi

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "**/*.kt"
      - "**/build.gradle.kts"
      - "**/src/test/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "enabled_plugins.txt"
      - ".github/workflows/Derleyici.yml"
      - "merge_plugins.py"
      - "prebuilt_plugins.json"
      - "tools/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      plugins:
        description: "Boşsa tüm etkin eklentiler; örnek: DiziBox HDFilmIzle"
        required: false
        default: ""

jobs:
  Derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Depo Kontrolu"
        uses: actions/checkout@v4.2.2

      - name: Python birim testleri
        run: python3 -m unittest discover -s tests -v

      - name: Opsiyonel anime eklentisi canlı yapı probu
        id: anime_probe
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'player-source-probe')
        continue-on-error: true
        run: |
          python3 tools/anime_plugin_probe.py > /tmp/anime-probe.md
          cat /tmp/anime-probe.md

      - name: Anime prob raporunu PR'a yaz
        if: always() && steps.anime_probe.outcome != 'skipped' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/anime-probe.md ]; then
            { echo "## Anime eklentisi canlı yapı probu"; echo; cat /tmp/anime-probe.md; } > /tmp/anime-probe-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/anime-probe-comment.md || true
          fi

      - name: Opsiyonel canlı player kaynağı incelemesi
        id: live_probe
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'player-source-probe')
        continue-on-error: true
        run: |
          python3 tools/live_player_probe.py > /tmp/live-player-probe.md
          cat /tmp/live-player-probe.md
          cat /tmp/live-player-probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Canlı player raporunu PR'a yaz
        if: always() && steps.live_probe.outcome != 'skipped' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/live-player-probe.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/live-player-probe.md || true
          fi

      - name: Opsiyonel anime akis zinciri probu (derin)
        id: chain_probe
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'player-source-probe')
        continue-on-error: true
        run: |
          python3 tools/anime_chain_probe.py > /tmp/anime-chain.md
          cat /tmp/anime-chain.md

      - name: Zincir raporunu PR'a yaz
        if: always() && steps.chain_probe.outcome != 'skipped' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/anime-chain.md ]; then
            { echo "## Anime akis zinciri (derin prob)"; echo; cat /tmp/anime-chain.md; } > /tmp/anime-chain-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/anime-chain-comment.md || true
          fi

      - name: Site HTML / kaynak zinciri tam dökümü
        id: site_dump
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'player-source-probe')
        continue-on-error: true
        env:
          SITE_DUMP_DIR: site-dump
        run: |
          python3 tools/site_deep_dump.py > /tmp/site-dump.md || true
          cat /tmp/site-dump.md
          ls -la site-dump | head -40

      - name: Site dökümünü PR'a yaz
        if: always() && steps.site_dump.outcome != 'skipped' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/site-dump.md ]; then
            { echo "## Site HTML dökümü (ham)"; echo; echo '```'; head -c 55000 /tmp/site-dump.md; echo '```'; } > /tmp/site-dump-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/site-dump-comment.md || true
          fi

      - name: Site dökümü artifact
        if: always() && steps.site_dump.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: site-dump-${{ github.run_id }}
          path: site-dump/
          if-no-files-found: warn
          retention-days: 14

      # Artifact'lar sandbox'tan indirilemiyor; ham HTML'i `site-dump-data`
      # dalına iterek okunabilir hâle getiriyoruz (zorla itme, tek amaç dal).
      - name: Site dökümünü dala it
        if: always() && steps.site_dump.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d site-dump ]; then echo "site-dump yok"; exit 0; fi
          rm -rf /tmp/dumppush && mkdir -p /tmp/dumppush
          cp -r site-dump/. /tmp/dumppush/
          cd /tmp/dumppush
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b site-dump-data
          git add -A
          git commit -qm "site dump ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site-dump-data && echo "döküm site-dump-data dalına itildi"

      # Eklentinin GERÇEK Kotlin kodu canlı siteye karşı koşar (LiveChainProbeTest).
      # Böylece "arama buluyor mu, bölüm listesi doğru mu, kaç akış çıkıyor"
      # sorusu tahminle değil, ölçümle yanıtlanır.
      - name: Canlı zincir probu (gerçek eklenti kodu)
        id: live_chain
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'player-source-probe')
        continue-on-error: true
        env:
          LIVE_PROBE: "1"
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :Anizm:testDebugUnitTest --tests "*LiveChainProbeTest*" \
              > /tmp/live-anizm.log 2>&1
          echo "anizm çıkış=$?"
          ./gradlew --no-daemon :Anizm:testDebugUnitTest --tests "*FullSourceAuditTest*" \
              > /tmp/audit-anizm.log 2>&1
          echo "audit çıkış=$?"
          ./gradlew --no-daemon :TrAnimeIzle:testDebugUnitTest --tests "*LiveChainProbeTest*" \
              > /tmp/live-tizle.log 2>&1
          echo "tranimeizle çıkış=$?"
          set -e
          {
            echo "# Canlı zincir probu (Kotlin)"
            echo
            echo '```'
            grep -a "\[LIVE\]" /tmp/live-anizm.log | sed 's/^.*\[LIVE\]/[LIVE]/' | head -c 20000 || true
            echo
            echo '```'
            echo
            echo "## Tam kaynak denetimi (Anizm)"
            echo
            echo '```'
            grep -a "\[AUDIT\]" /tmp/audit-anizm.log | grep -a "ÖZET\|toplam\|kapsamında\|oynatılabilir\|KAPSANMAYAN\|SORUNLU\|  ✗\|┌ DÖKÜM\|│ HTTP\|│ başlık\|│ medya\|│ iframe" | sed 's/^.*\[AUDIT\]/[AUDIT]/' | head -c 14000 || true
            echo
            echo '```'
            echo
            echo "## Site oynatıcısı + SPA uçları"
            echo
            echo '```'
            grep -a "SITE OYNAYICISI\|EP http\|SISTENN\|API-CTX\|FS \|SC \|BUNDLE \|  SPA \|  \[m3u8\]\|  \[.mp4\]\|  \[sources\]\|  \[videoUrl\]\|  \[manifest\]\|  \[/api/\]\|  \[stream\]\|  \[playlist\]\|  API http\|SPA http\|    paket\|    api  \|    fetch" /tmp/audit-anizm.log | sed 's/^.*\[AUDIT\]//' | head -c 18000 || true
            echo
            echo '```'
            echo
            echo '```'
            grep -a "\[LIVE\]" /tmp/live-tizle.log | sed 's/^.*\[LIVE\]/[LIVE]/' | head -c 22000 || true
            echo
            echo '```'
            if ! grep -qa "\[LIVE\]" /tmp/live-anizm.log; then
              echo
              echo "<details><summary>Anizm derleme/koşum hatası</summary>"
              echo
              echo '```'
              tail -n 60 /tmp/live-anizm.log
              echo '```'
              echo "</details>"
            fi
            if ! grep -qa "\[LIVE\]" /tmp/live-tizle.log; then
              echo
              echo "<details><summary>TrAnimeIzle derleme/koşum hatası</summary>"
              echo
              echo '```'
              tail -n 60 /tmp/live-tizle.log
              echo '```'
              echo "</details>"
            fi
          } > /tmp/live-chain.md
          head -c 55000 /tmp/live-chain.md

      - name: Canlı zincir raporunu PR'a yaz
        if: always() && steps.live_chain.outcome != 'skipped' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/live-chain.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/live-chain.md || true
          fi

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Lisansları
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Etkin Eklentileri Derle
        id: build
        env:
          REQUESTED_PLUGINS: ${{ inputs.plugins }}
        run: |
          chmod +x gradlew

          ENABLED=""
          if [ -f enabled_plugins.txt ]; then
            ENABLED=$(grep -vE '^[[:space:]]*(#|$)' enabled_plugins.txt | tr -d '\r' | sed 's/[[:space:]]*$//' || true)
          fi
          if [ -n "$REQUESTED_PLUGINS" ]; then
            ENABLED="$REQUESTED_PLUGINS"
            echo "Manuel derleme listesi: $ENABLED"
          fi

          TASKS=""
          for dir in $ENABLED; do
            if [ -f "$dir/build.gradle.kts" ]; then
              TASKS="$TASKS :$dir:make"
              echo "Derlenecek: $dir"
            fi
          done

          if [ -z "$TASKS" ]; then
            echo "Derlenecek etkin eklenti bulunamadi."
            exit 0
          fi

          set +e
          ./gradlew --no-daemon $TASKS makePluginsJson > /tmp/build.log 2>&1
          STATUS=$?
          set -e

          # Konsola da yaz (normal ortamlarda görünsün)
          tail -n 120 /tmp/build.log

          if [ $STATUS -ne 0 ]; then
            {
              echo "### ❌ Derleme başarısız"
              echo ""
              echo '```'
              grep -nE "^e: |error:|Unresolved reference|Compilation error|FAILURE:|What went wrong|Caused by:" /tmp/build.log | head -n 60
              echo '```'
              echo ""
              echo "<details><summary>Logun sonu</summary>"
              echo ""
              echo '```'
              tail -n 100 /tmp/build.log
              echo '```'
              echo "</details>"
            } > /tmp/comment.md
            echo "comment=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ Derleme başarılı"

      - name: "Birim Testleri (regresyon)"
        id: test
        env:
          REQUESTED_PLUGINS: ${{ inputs.plugins }}
        run: |
          chmod +x gradlew

          TEST_PLUGINS=$(grep -vE '^[[:space:]]*(#|$)' enabled_plugins.txt | tr -d '\r' | sed 's/[[:space:]]*$//' || true)
          if [ -n "$REQUESTED_PLUGINS" ]; then
            TEST_PLUGINS="$REQUESTED_PLUGINS"
          fi
          TEST_TASKS=""
          for dir in $TEST_PLUGINS; do
            if [ -d "$dir/src/test" ]; then
              TEST_TASKS="$TEST_TASKS :$dir:test"
              echo "Test edilecek: $dir"
            fi
          done

          if [ -z "$TEST_TASKS" ]; then
            echo "Test dizini olan etkin eklenti yok."
            exit 0
          fi

          set +e
          ./gradlew --no-daemon $TEST_TASKS > /tmp/test.log 2>&1
          STATUS=$?
          set -e

          tail -n 120 /tmp/test.log

          if [ $STATUS -ne 0 ]; then
            {
              echo "### ❌ Birim testleri başarısız"
              echo ""
              echo '```'
              grep -nE "FAILED|expected:|AssertionError|error:|^e: |FAILURE:|What went wrong" /tmp/test.log | head -n 60
              echo '```'
              echo ""
              echo "<details><summary>Logun sonu</summary>"
              echo ""
              echo '```'
              tail -n 100 /tmp/test.log
              echo '```'
              echo "</details>"
            } > /tmp/comment.md
            echo "comment=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ Birim testleri başarılı"

      - name: Derlenen eklentileri indirilebilir artifact olarak ekle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kitsugi-Plugins-${{ github.run_id }}
          path: |
            DiziBox/build/DiziBox.cs3
            HDFilmIzle/build/HDFilmIzle.cs3
          if-no-files-found: warn
          retention-days: 14

      - name: Hatayı PR'a Yaz
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md || true
          fi

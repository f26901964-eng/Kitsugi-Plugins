name: CrossSync v359 patch verification

on:
  workflow_dispatch:
  push:
    branches:
      - arena/583b8e7d-kitsugi-plugins
    paths:
      - .ci/crosssync-v359.patch
      - .github/workflows/crosssync-v359-verify.yml

permissions:
  # Temporary evidence handoff: signed Actions log downloads are unreachable from
  # the analysis sandbox, so the job commits only its log/JUnit artifacts here.
  contents: write

jobs:
  targeted-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout patch carrier
        uses: actions/checkout@v4
        with:
          path: patch-carrier

      - name: Checkout pristine Kitsugi-Beta v359
        uses: actions/checkout@v4
        with:
          repository: f26901964-eng/Kitsugi-Beta
          ref: a8d7aaf6a7e450edc6095c5dcd5aaf913f7a4b03
          path: app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verify and apply patch
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = "a8d7aaf6a7e450edc6095c5dcd5aaf913f7a4b03"
          git apply --check ../patch-carrier/.ci/crosssync-v359.patch
          git apply ../patch-carrier/.ci/crosssync-v359.patch
          git diff --check
          git status --short

      - name: Run CrossSync regression tests
        working-directory: app
        env:
          GRADLE_OPTS: -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:testFossDebugUnitTest \
            --tests 'com.kitsugi.animelist.data.auth.*' \
            --tests 'com.kitsugi.animelist.data.platform.*' \
            --tests 'com.kitsugi.animelist.data.remote.BangumiIdNamespaceTest' \
            --tests 'com.kitsugi.animelist.data.remote.BangumiMalCrosswalkTest' \
            --tests 'com.kitsugi.animelist.data.remote.SimklSyncContractTest' \
            --tests 'com.kitsugi.animelist.model.*' \
            --stacktrace --console=plain 2>&1 | tee crosssync-tests.log

      - name: Publish result summary
        if: always()
        working-directory: app
        run: |
          {
            echo '# CrossSync v359 verification'
            echo
            echo "Baseline: $(git rev-parse HEAD)"
            echo "Job status: ${{ job.status }}"
            echo
            echo 'Changed paths:'
            echo '```'
            git status --short
            echo '```'
            if [ -f crosssync-tests.log ]; then
              echo
              echo 'Final test log lines:'
              echo '```text'
              tail -n 60 crosssync-tests.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit temporary test evidence
        if: always()
        working-directory: patch-carrier
        run: |
          mkdir -p .ci/results
          if [ -f ../app/crosssync-tests.log ]; then
            cp ../app/crosssync-tests.log ".ci/results/crosssync-tests-${GITHUB_RUN_ID}.txt"
          else
            echo "Gradle did not produce crosssync-tests.log; job status: ${{ job.status }}" > ".ci/results/crosssync-tests-${GITHUB_RUN_ID}.txt"
          fi
          if [ -d ../app/app/build/test-results/testFossDebugUnitTest ]; then
            tar -czf ".ci/results/test-results-${GITHUB_RUN_ID}.tar.gz" -C ../app/app/build/test-results/testFossDebugUnitTest .
          fi
          git config user.name "Arena CrossSync CI"
          git config user.email "arena-crosssync-ci@localhost"
          git add -f .ci/results
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: collect CrossSync evidence ${GITHUB_RUN_ID}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# TrAnimeIzle canlı HTML dökümü — GitHub runner'ından (tam internet erişimi).
#
# Site veri merkezi ASN'lerine Cloudflare **Error 1005** döndürüyor. Bu iş akışı
# sırayla erişim katmanlarını ölçer (direct / translate / jina / cors proxy /
# wayback), **çalışan katmanı** seçer ve o katmanla tam zincir dökümü alır:
#
#   ana sayfa → listeler → arama → detay → bölüm →
#   her fansub için /api/fansubSources →
#   her kaynak için /api/sourcePlayer + /api/preVideoAd →
#   her oynatıcı sayfası ve iç iframe'i
#
# Neden 3 iş?  Job süre aşımına düşse bile **matris çıktısı** ve **kısmi döküm**
# kaybolmasın: her iş kendi artifact'ını yükler, son iş hepsini tek seferde
# `tranime-dump-data` dalına iter (sandbox artifact indiremiyor, dal okuyabiliyor).
name: TrAnimeIzle Döküm

on:
  # `workflow_dispatch` GitHub'da yalnızca varsayılan dalda kayıtlıysa tetiklenir;
  # o yüzden bu dalda `push` ile de çalışır.
  push:
    branches:
      - arena/8602198f-kitsugi-plugins
    paths:
      - "tools/tizle_*.py"
      - ".github/workflows/Tizle-Dump.yml"
  workflow_dispatch:
    inputs:
      query:
        description: "Arama sorgusu"
        required: false
        default: "one piece"
      url:
        description: "Bölüm sayfası (boşsa arama → ilk kart)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  Reach:
    name: Erişim matrisi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Matris (hızlı mod)
        id: matrix
        continue-on-error: true
        run: |
          mkdir -p site-dump
          : > site-dump/reach-matrix.txt
          for d in https://www.tranimeizle.io/ https://www.tranimeizle.live/ https://www.tranimeizle.top/; do
            echo "## $d" >> site-dump/reach-matrix.txt
            python3 tools/tizle_reach.py --fast --url "$d" \
              --winner-out "site-dump/winner-$(echo "$d" | cut -d/ -f3 | tr . _).txt" \
              >> site-dump/reach-matrix.txt 2>&1 || true
            echo >> site-dump/reach-matrix.txt
          done
          cat site-dump/reach-matrix.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reach
          path: site-dump/

  Arsiv:
    name: Arşiv kazısı (Wayback)
    needs: Reach
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: reach
          path: site-dump
      - name: Wayback'ten gerçek HTML
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python3 tools/tizle_archive.py --out site-dump/arsiv --sleep 2 --attempts 2 \
            --max-episodes 5 --query "${{ inputs.query || 'naruto' }}" \
            | tee site-dump/arsiv-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arsiv
          path: site-dump/

  Dump:
    name: Tam zincir dökümü
    needs: Reach
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: reach
          path: site-dump
      - name: Seçilen katman + domain
        id: pick
        run: |
          shopt -s nullglob
          WINNER=""
          DOMAIN=""
          for f in site-dump/winner-*.txt; do
            value="$(cat "$f" 2>/dev/null || true)"
            if [ -n "$value" ]; then
              WINNER="$value"
              host="$(basename "$f" .txt)"
              host="${host#winner-}"
              DOMAIN="https://${host//_/.}"
              break
            fi
          done
          echo "winner=${WINNER:-direct}" >> "$GITHUB_OUTPUT"
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "Seçilen katman: ${WINNER:-direct} · domain: ${DOMAIN:-otomatik}"
      - name: Döküm (seçilen katman)
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python3 tools/tizle_dump.py \
            --out site-dump/tranime \
            --query "${{ inputs.query || 'one piece' }}" \
            --url "${{ inputs.url }}" \
            --domain "${{ steps.pick.outputs.domain }}" \
            --via "${{ steps.pick.outputs.winner }}" \
            --probe | tee site-dump/dump-log.txt || true
      - name: Özet
        if: always()
        run: |
          {
            echo "## TrAnimeIzle dökümü"
            echo '```'
            head -c 9000 site-dump/reach-matrix.txt 2>/dev/null || echo "(matris yok)"
            echo '```'
            head -c 14000 site-dump/dump-log.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dump
          path: site-dump/

  Publish:
    name: Dal'a it
    needs: [Reach, Arsiv, Dump]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: site-dump
          merge-multiple: true
      - name: tranime-dump-data dalına zorla it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R site-dump | head -60 || true
          if [ ! -d site-dump ]; then echo "site-dump yok"; exit 0; fi
          rm -rf /tmp/dumppush && mkdir -p /tmp/dumppush
          cp -r site-dump/. /tmp/dumppush/
          cd /tmp/dumppush
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b tranime-dump-data
          git add -A
          git commit -qm "tranime dump ${GITHUB_RUN_ID}" || echo "değişiklik yok"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:tranime-dump-data \
            && echo "döküm tranime-dump-data dalına itildi"

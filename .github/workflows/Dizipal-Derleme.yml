# DiziPal için hızlı derleme + birim testi geri bildirimi.
# (Uzun süren canlı döküm işlerini beklemeden Kotlin hatalarını görmek için.)
name: DiziPal Derleme

on:
  push:
    # ! Dal filtresi yok: hangi çalışma dalında DiziPal'a dokunulursa derleme dönsün.
    paths:
      - "DiziPal/**"
      - ".github/workflows/Dizipal-Derleme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Derle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: JDK 17
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK lisansları
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Derle ve test et
        run: |
          chmod +x gradlew
          # ! `pipefail` YOKTU: `| tee` yüzünden Gradle başarısız olsa bile adım
          # ! "success" görünüyordu (exit code tee'den geliyordu). Maven 409 hatası
          # ! bu yüzden maskelendi.
          set +e
          ./gradlew :DiziPal:make --stacktrace 2>&1 | tee build.log
          MAKE_RC=${PIPESTATUS[0]}
          ./gradlew :DiziPal:test --stacktrace 2>&1 | tee -a build.log
          TEST_RC=${PIPESTATUS[0]}
          {
            echo "MAKE_RC=$MAKE_RC"
            echo "TEST_RC=$TEST_RC"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAKE_RC" -ne 0 ] || [ "$TEST_RC" -ne 0 ]; then
            echo "::error::Gradle başarısız (make=$MAKE_RC, test=$TEST_RC)"
            exit 1
          fi
      - name: Günlüğü dala it (sandbox artefakt indiremiyor)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/net
          cp build.log /tmp/net/ 2>/dev/null || true
          mkdir -p /tmp/net/tests
          cp -r DiziPal/build/test-results/test /tmp/net/tests/ 2>/dev/null || true
          ls -R /tmp/net | head -20
          cd /tmp/net && git init -q && git config user.email "actions@github.com" && git config user.name "GitHub Actions"
          git checkout -q -b dizipal-build-data
          git add -A && git commit -qm "dizipal build ${GITHUB_RUN_ID}" || echo "değişiklik yok"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dizipal-build-data \
            && echo "günlük dizipal-build-data dalına itildi"
      - name: Özet
        if: always()
        run: |
          {
            echo "## DiziPal derleme"
            echo '```'
            grep -E "^(e:|w: .*DiziPal)|BUILD|Task :DiziPal|tests? (completed|failed)|FAILED" build.log | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# DiziBox için hızlı derleme + birim testi geri bildirimi.
# Testler gerçek site dökümlerini (DiziBox/site-dumps/*.html) ayrıştırır; yani
# "site yapısı hâlâ eklentinin beklediği gibi mi" sorusunu ağ olmadan yanıtlar.
name: DiziBox Derleme

on:
  push:
    # ! Dal filtresi yok: hangi çalışma dalında DiziBox'a dokunulursa derleme dönsün.
    paths:
      - "DiziBox/**"
      - "tools/dizibox_probe.py"
      - ".github/workflows/Dizibox-Derleme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Derle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - name: JDK 17
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK lisansları
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Derle ve test et
        env:
          LIVE_PROBE: "1"
        run: |
          chmod +x gradlew
          # ! Adımlar ayrı ayrı ölçülür: hangi Gradle task'ının kırıldığı
          #    tek bakışta görünsün (tek satırda birleşince ayırt edilemiyordu).
          set +e
          ./gradlew :DiziBox:make --stacktrace 2>&1 | tee build.log
          MAKE_RC=${PIPESTATUS[0]}
          ./gradlew :DiziBox:test --stacktrace 2>&1 | tee -a build.log
          TEST_RC=${PIPESTATUS[0]}
          echo "MAKE_RC=$MAKE_RC TEST_RC=$TEST_RC"
          {
            echo "MAKE_RC=$MAKE_RC"
            echo "TEST_RC=$TEST_RC"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_RC" -ne 0 ]; then
            # ! Artefakt (zip/blob) bu ortamdan indirilemiyor; başarısız testleri
            #   hem özet hem ::error:: annotasyonu olarak yayınla — annotasyon
            #   GitHub API'sinden okunabiliyor.
            echo "## Başarısız testler" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILED|AssertionError|expected:|Caused by|Exception" build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            FAILED_LIST=$(grep -oE "[A-Za-z]+Test > [^ ]+ FAILED" build.log | head -12 || true)
            if [ -z "$FAILED_LIST" ]; then
              FAILED_LIST=$(grep -E "AssertionError|expected:" build.log | head -6 || true)
            fi
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done <<< "$FAILED_LIST"
          fi
          if [ "$MAKE_RC" -ne 0 ] || [ "$TEST_RC" -ne 0 ]; then
            echo "::error::Gradle başarısız (make=$MAKE_RC, test=$TEST_RC)"
            exit 1
          fi
      - name: DiziBox eklentisini sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DiziBox-cs3
          path: DiziBox/build/DiziBox.cs3
          if-no-files-found: error
      - name: Test sonuçlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiziBox-test-sonuclari
          path: |
            build.log
            DiziBox/build/test-results/
          if-no-files-found: warn
      - name: Özet
        if: always()
        run: |
          {
            echo "## DiziBox derleme"
            echo '```'
            grep -E "^(e:|w: .*DiziBox)|BUILD|Task :DiziBox|PASSED|FAILED|LIVE" build.log | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

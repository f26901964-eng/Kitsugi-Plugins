# DiziBox için hızlı derleme + birim testi geri bildirimi.
# Testler gerçek site dökümlerini (DiziBox/site-dumps/*.html) ayrıştırır; yani
# "site yapısı hâlâ eklentinin beklediği gibi mi" sorusunu ağ olmadan yanıtlar.
name: DiziBox Derleme

on:
  push:
    # ! Dal filtresi yok: hangi çalışma dalında DiziBox'a dokunulursa derleme dönsün.
    paths:
      - "DiziBox/**"
      - "tools/dizibox_probe.py"
      - ".github/workflows/Dizibox-Derleme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Derle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - name: JDK 17
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK lisansları
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Derle ve test et
        env:
          LIVE_PROBE: "1"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :DiziBox:make :DiziBox:test --stacktrace 2>&1 | tee build.log
      - name: Günlüğü dala it (sandbox artefakt indiremiyor)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/net/tests
          cp build.log /tmp/net/ 2>/dev/null || true
          cp -r DiziBox/build/test-results/test /tmp/net/tests/ 2>/dev/null || true
          cd /tmp/net && git init -q && git config user.email "actions@github.com" && git config user.name "GitHub Actions"
          git checkout -q -b dizibox-build-data
          git add -A && git commit -qm "dizibox build ${GITHUB_RUN_ID}" || echo "değişiklik yok"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dizibox-build-data \
            && echo "günlük dizibox-build-data dalına itildi"
      - name: Özet
        if: always()
        run: |
          {
            echo "## DiziBox derleme"
            echo '```'
            grep -E "^(e:|w: .*DiziBox)|BUILD|Task :DiziBox|PASSED|FAILED|LIVE" build.log | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# DiziBox için hızlı derleme + birim testi geri bildirimi.
# Testler gerçek site dökümlerini (DiziBox/site-dumps/*.html) ayrıştırır; yani
# "site yapısı hâlâ eklentinin beklediği gibi mi" sorusunu ağ olmadan yanıtlar.
name: DiziBox Derleme

on:
  push:
    # ! Dal filtresi yok: hangi çalışma dalında DiziBox'a dokunulursa derleme dönsün.
    paths:
      - "DiziBox/**"
      - "tools/dizibox_probe.py"
      - ".github/workflows/Dizibox-Derleme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Derle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - name: JDK 17
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK lisansları
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Derle ve test et
        env:
          LIVE_PROBE: "1"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :DiziBox:make :DiziBox:test --stacktrace 2>&1 | tee build.log
      - name: DiziBox eklentisini sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DiziBox-cs3
          path: DiziBox/build/DiziBox.cs3
          if-no-files-found: error
      - name: Test sonuçlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiziBox-test-sonuclari
          path: |
            build.log
            DiziBox/build/test-results/
          if-no-files-found: warn
      - name: Özet
        if: always()
        run: |
          {
            echo "## DiziBox derleme"
            echo '```'
            grep -E "^(e:|w: .*DiziBox)|BUILD|Task :DiziBox|PASSED|FAILED|LIVE" build.log | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

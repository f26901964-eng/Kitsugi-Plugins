name: CrossSync Rapor Bütünlük Aktarımı (Geçici)

on:
  push:
    branches:
      - arena/583b8e7d-kitsugi-plugins
    paths:
      - .github/workflows/CrossSync-Rapor-Gecici.yml

permissions:
  contents: write

jobs:
  indir-dogrula-ve-aktar:
    runs-on: ubuntu-latest
    steps:
      - name: Çalışma dalını al
        uses: actions/checkout@v4
        with:
          ref: arena/583b8e7d-kitsugi-plugins

      - name: Raporu indir ve bütünlüğünü doğrula
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://drive.google.com/uc?export=download&id=1DdqkHOQUZVeFzQ3wH5D18y61Pjj08udX' \
            -o report.txt
          printf '%s  %s\n' '635fa5171b70877fdda5f86c426471f6' 'report.txt' | md5sum -c -
          test "$(wc -c < report.txt)" = '8280517'
          wc -l -c report.txt
          sha256sum report.txt
          gzip -9 -c report.txt > crosssync-report-20261024.txt.gz

      - name: Sıkıştırılmış raporu aynı çalışma dalına geçici olarak aktar
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crosssync-report-20261024.txt.gz
          git commit -m 'chore(crosssync): doğrulanmış raporu geçici aktar'
          git push origin HEAD:arena/583b8e7d-kitsugi-plugins

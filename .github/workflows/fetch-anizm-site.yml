# GEÇİCİ: puffytr.com (Anizm) site HTML/JS yakalama — plugin kodu için.
# Sadece arena/fetch-anizm* dallarında çalışır; .done flag'i ile tek sefer.
name: Anizm Site Capture

on:
  push:
    branches:
      - "arena/fetch-anizm*"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0"
        run: |
          OUT=research/anizm-capture
          mkdir -p "$OUT"
          if [ -f "$OUT/.done" ]; then echo "ZATEN ALINDI - cikis"; exit 0; fi
          dl() {
            url="$1"; file="$2"
            code=$(curl -sL -A "$UA" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: tr-TR,tr;q=0.9,en;q=0.5" -o "$file" -w "%{http_code}" --max-time 60 "$url" 2>/dev/null || echo "000")
            echo "[$code] $url -> $file ($(wc -c < "$file" 2>/dev/null || echo 0) B)"
          }
          dl "https://puffytr.com/" "$OUT/home.html"
          dl "https://puffytr.com/shingeki-no-kyojin-1-bolum-izle" "$OUT/episode.html"
          dl "https://puffytr.com/shingeki-no-kyojin" "$OUT/anime.html"
          if [ -f "$OUT/episode.html" ]; then head -c 300 "$OUT/episode.html" > "$OUT/episode-head.txt"; echo; fi
          cat "$OUT"/*.html 2>/dev/null | grep -oE '(src|href|content)="[^"]+\.(js|mjs|css)(\?[^"]*)?"' | sed -E 's/^[a-zA-Z]+="([^"]+)"/\1/' | sort -u > "$OUT/assets.txt" || true
          cat "$OUT/assets.txt" > "$OUT/assets-cnt.txt" || true
          echo "asset sayisi: $(wc -l < "$OUT/assets.txt" 2>/dev/null || echo 0)"
          : > "$OUT/assets-map.txt"
          n=0
          if [ -f "$OUT/assets.txt" ]; then
            while IFS= read -r p; do
              n=$((n+1)); [ "$n" -gt 50 ] && break
              case "$p" in
                http*) u="$p" ;;
                //*) u="https:$p" ;;
                /*) u="https://puffytr.com$p" ;;
                *) u="https://puffytr.com/$p" ;;
              esac
              fn="asset-$(printf '%s' "$u" | md5sum | cut -c1-12)"
              curl -sL -A "$UA" -H "Accept-Language: tr-TR,tr;q=0.9" -H "Referer: https://puffytr.com/shingeki-no-kyojin-1-bolum-izle" --max-time 60 "$u" -o "$OUT/$fn.bin" 2>/dev/null || true
              echo "$u -> $fn.bin ($(wc -c < "$OUT/$fn.bin" 2>/dev/null || echo 0) B)" >> "$OUT/assets-map.txt" || true
            done < "$OUT/assets.txt"
          fi
          cat "$OUT/assets-map.txt" || true
          grep -ohE "/api/[a-zA-Z0-9_/.-]+" "$OUT"/*.bin 2>/dev/null | sort -u > "$OUT/api-hints.txt" || true
          grep -ohE "fetch\([^)]{0,140}" "$OUT"/*.bin 2>/dev/null | head -40 > "$OUT/fetch-hints.txt" || true
          grep -ohE "axios[^;]{0,140}" "$OUT"/*.bin 2>/dev/null | head -20 > "$OUT/axios-hints.txt" || true
          echo "API HINTS:"; cat "$OUT/api-hints.txt" || true
          touch "$OUT/.done"
          echo "CAPTURE-TAMAM"
      - name: Commit back
        run: |
          git config user.name "arena-fetch"
          git config user.email "arena-fetch@users.noreply.github.com"
          git add research/anizm-capture 2>/dev/null || true
          if git diff --cached --quiet; then echo "degisiklik yok"; else git commit -m "anizm site capture $(date -u +%F)" || true; fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD || echo "push basarisiz"

name: Arena Probe (gecici)

on:
  push:
    branches:
      - "arena/c828d056-kitsugi-plugins"
    paths:
      - "arena-probe/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -U requests cloudscraper
      - name: Kesif
        run: |
          python arena-probe/probe3.py || true
          du -sh arena-probe/out3 || true
      - name: Sonuclari dala push et
        if: always()
        run: |
          set -e
          cd arena-probe/out3
          git init -q .
          git config user.email "probe@arena.local"
          git config user.name "Arena Probe"
          git add -A
          git commit -qm "probe cikti"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/arena/probe-out

# GECICI arastirma akisi — canli siteleri TR cikisli proxy ile inceler.
# Sandbox artifact/log indiremedigi icin cikti AYNI dala (arena/af53f8ad-...)
# arena-probe/out/ altina commit edilir. Is bitince bu dosya ve arena-probe/
# klasoru silinecek.
name: Arena Probe (gecici)

on:
  push:
    branches:
      - "arena/af53f8ad-kitsugi-plugins"
    paths:
      - "arena-probe/*.py"
      - "arena-probe/*.js"
      - "arena-probe/RUN"
      - ".github/workflows/arena-probe.yml"

concurrency:
  group: arena-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python bagimliliklari
        run: pip install -U "requests[socks]" pysocks

      - name: TR proxy bul
        run: python arena-probe/find_proxy.py

      - name: Proxy yoksa VPN Gate dene
        run: |
          N=$(python -c "import json;print(len(json.load(open('arena-probe/out/proxies.json'))))")
          echo "calisan proxy: $N"
          if [ "$N" = "0" ]; then
            sudo apt-get install -y openvpn >/dev/null 2>&1 || true
            python arena-probe/vpngate.py || true
          fi

      - name: Sayfalari tara
        timeout-minutes: 18
        continue-on-error: true
        run: cd arena-probe && python crawl.py

      - name: Oynatici JS'ini calistir
        run: cd arena-probe && node eval_player.js || true

      - name: Yayin adreslerini dogrula
        timeout-minutes: 8
        continue-on-error: true
        run: cd arena-probe && python verify_streams.py || true

      - name: Gercek tarayici (istege bagli)
        if: ${{ hashFiles('arena-probe/BROWSER') != '' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cd arena-probe && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          timeout 420 npx playwright install --with-deps chromium || true
          timeout 600 node browser_probe.js || true

      - name: Ciktiyi ayni dala yaz
        if: always()
        run: |
          git config user.name "arena-probe"
          git config user.email "arena-probe@users.noreply.github.com"
          rm -rf arena-probe/node_modules arena-probe/package*.json
          git add -f arena-probe/out
          git commit -m "chore(probe): canli tarama ciktisi (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" && break
            sleep 5
          done

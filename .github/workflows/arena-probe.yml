name: Arena Probe (gecici)

on:
  push:
    branches:
      - "arena/c828d056-kitsugi-plugins"
    paths:
      - "arena-probe/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -U requests cloudscraper
      - name: Kesif
        run: |
          python arena-probe/probe.py || true
      - name: Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: arena-probe/out
          retention-days: 3

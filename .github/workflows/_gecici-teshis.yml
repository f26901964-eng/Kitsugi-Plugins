# GEÇİCİ TEŞHİS WORKFLOW'U — iş bitince SİLİNECEK.
# Amacı: (1) canlı sitelerin güncel yanıtlarını görmek, (2) yerel derlemeyi doğrulamak.
name: Gecici Teshis (silinecek)

on:
  workflow_dispatch:
    inputs:
      build_plugins:
        description: "Derlenecek eklentiler (boslukla ayrilmis). Bos birakilirsa varsayilan liste."
        required: false
        default: ""

jobs:
  Teshis:
    runs-on: ubuntu-latest
    steps:
      - name: Depo Kontrolu
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Siteleri Yokla
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"

          probe () {
            local url="$1"; local label="${2:-}"
            echo "==================== $label $url"
            body=$(mktemp)
            code=$(curl -s -L --max-time 25 -A "$UA" \
              -H "Accept: text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: tr-TR,tr;q=0.9,en;q=0.8" \
              -w "%{http_code} %{url_effective}" -o "$body" "$url")
            echo "SONUC: $code"
            echo "BOYUT: $(wc -c <"$body")"
            echo "--- ILK 1500 KARAKTER ---"
            head -c 1500 "$body" | tr -d '\000'
            echo
            echo "--- BASLIK ---"
            grep -oiE "<title[^>]*>[^<]{0,150}" "$body" | head -2
            echo "--- ISARETLER ---"
            for kw in "Just a moment" "izinsiz" "İzinsiz" "cloudflare" "park" "Domain" "satılık" "Satılık" "example.com" "used_slug" "searchcontent" "getserielistbychannel" "cKey"; do
              c=$(grep -c -i -- "$kw" "$body" 2>/dev/null)
              [ "${c:-0}" != "0" ] && echo "  [$kw] x$c"
            done
            rm -f "$body"
            echo
          }

          probe "https://www.roketdizi.live/dizi/tur/aksiyon?&page=1" "ROKET-ana-sayfa"
          probe "https://roketdizi.live" "ROKET-kok"
          probe "https://www.hdfilmcehennemi2.biz/" "HDFC2-biz"
          probe "https://www.hdfilmcehennemi2.site/" "HDFC2-site"
          probe "https://www.hdfilmcehennemi2.nl/" "HDFC2-nl"
          probe "https://www.hdfilmcehennemi.nl/" "HDFC-nl"
          probe "https://dizipal1588.com/yabanci-dizi-izle" "DIZIPAL1588"
          probe "https://selcukflix.com" "SELCUK-com"
          probe "https://selcukflix.net" "SELCUK-net"
          probe "https://selcukflix.co" "SELCUK-co"
          probe "https://backend.xprime.tv/servers" "XPRIME-backend"
          probe "https://api.themoviedb.org/3/movie/550?api_key=84259f99204eeb7d45c7e3d8e36c6123&language=tr-TR" "TMDB-key-testi"

          echo "==================== SELCUKFLIX ARAMA API (POST)"
          curl -s -i --max-time 25 -A "$UA" -X POST \
            -H "Accept: application/json, text/plain, */*" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://selcukflix.com/" \
            "https://selcukflix.com/api/bg/searchcontent?searchterm=squid" | head -c 2000
          echo
          echo "==================== DIZIPAL API (POST)"
          curl -s -i --max-time 25 -A "$UA" -X POST \
            -H "Accept: application/json, text/javascript, */*; q=0.01" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://dizipal1588.com/yabanci-dizi-izle" \
            --data "cKey=c61f91c5141d178450934fe81c0a2029&cValue=MTc4NDQwNzIwMDhkMzJhNTc1YzUwOGU1ZjQwMjdjMjIyOWVjOGVhMTcwNGQyM2FjODM2YTI4YTU0NjUyMjI2ZmVjMzFkYzBkMWQyMWY4YzdiNA==&curPage=1&channelId=1&languageId=2,3,4&slug=netflix" \
            "https://dizipal1588.com/bg/getserielistbychannel" | head -c 1500
          echo

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Degisiklikleri Derle
        run: |
          LIST="${{ github.event.inputs.build_plugins }}"
          if [ -z "$LIST" ]; then
            LIST="DiziPal SelcukFlix RoketDizi HDFilmCehennemi2 XPrime NeonSpor FilmPalast"
          fi
          TASKS=""
          for dir in $LIST; do
            if [ -f "$dir/build.gradle.kts" ]; then
              TASKS="$TASKS :$dir:make"
            fi
          done
          echo "TASKS=$TASKS"
          [ -z "$TASKS" ] && echo "Derlenecek eklenti yok." && exit 0
          chmod +x gradlew
          ./gradlew $TASKS --stacktrace 2>&1 | tail -60

<title>Force Landscape v2.13.0</title>
<style>
:root{
  --bg:#0e1116; --bg2:#151a22; --card:#1a2029; --line:#26303d; --txt:#e8eef7;

  :root{--bg:#f4f7fb;--bg2:#ffffff;--card:#ffffff;--line:#dfe7f1;--txt:#131a24;--dim:#5a6b80;--accent:#1c7ed6;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ---- v2.7: ikon + alt yazi dugmeler, gercek logo ---- */

<body>

<header>
  <div class="hrow">
    <div>
      <div class="title">Force Landscape <span class="sub" id="ver">v2.13.0</span></div>
      <div class="sub" id="hdev">cihaz bilgisi yükleniyor…</div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="orient">?</span>
    <span class="pill" id="layer" style="display:none"></span>
    <button class="sm ghost" id="btnRefresh" title="Yenile">⟳</button>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div id="view"><div class="centered"><span class="spin"></span>yükleniyor…</div></div>
<div class="toast" id="toast"></div>
<div id="sheetHost"></div>

<script>
"use strict";
/* ============================================================
   Force Landscape v2.13.0 — WebUI
   Tasarım kuralları:
   * Açılışta en fazla 2 arka uç çağrısı (status + apps).
   * Otomatik yenileme SADECE başlık rozetlerini günceller; sekme
     içeriğini ASLA yeniden çizmez (kaydırma/odak kaybı olmasın).
   * Her komut zaman aşımına sahip; köprü yoksa/patlarsa ekranda
     açıklama görünür, sayfa ölmez.
   ============================================================ */

/* Modul dizini: once yoneticiden (ksu.moduleInfo), olmazsa sabit yol.
   KernelSU WebUI sayfayi https://mui.kernelsu.org/ uzerinden servis eder;
   bu yuzden location.pathname gercek dosya yolunu VERMEZ. */
let MODDIR = "/data/adb/modules/force_landscape_all";
let SCRIPT = MODDIR + "/webui.sh";
let SHELL = "/system/bin/sh";       // Android'de her zaman vardir

const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? "" : s)
  .replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let ST = {};            // status
let APPS = [];          // uygulama listesi
let CSTAT = [];         // letterbox paket durumlari
let TAB = "durum";
let Q = "";             // arama
let FILTER = "hepsi";   // hepsi|force|skip|applied|degil
let SORT = "ad";        // ad|durum|boyut
let LOGSRC = "modul";   // modul|hata|compat|sistem|test|yon
let LOGN = 300;
let LOGQ = "";
let AUTO = true;        // otomatik yenileme
let busy = false, busyText = "";
let lastErr = "";
let APP_ERR = "";
let NOTICE = "";
let pollTimer = null, logTimer = null;
let COPY = {};          // sayfa ici kopyalanacak metinler

/* ---------------- köprü ---------------- */
function hasKsu(){ return typeof ksu !== "undefined" && ksu && typeof ksu.exec === "function"; }

let BRIDGE = "unknown";   // async | sync | promise | none
let cbSeq = 0;
let BLOCKING = true;      // sync kopru -> arayuz komut suresince donar
let CMD_TIMEOUT = 120000;

function toast(m){
  const t = $("toast");
  t.textContent = String(m);
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("on"), 2600);
}

/* --- async kopru: exec(cmd, options, callbackAdi) --- */
function execAsync(cmd){
  return new Promise((resolve, reject)=>{
    const name = "__ksucb_" + (++cbSeq);
    let settled = false;
    const to = setTimeout(()=>{
      if(settled) return;
      settled = true;
      try{ delete window[name]; }catch(e){}
      reject(new Error("komut zaman aşımı (" + Math.round(CMD_TIMEOUT/1000) + " sn)"));
    }, CMD_TIMEOUT);
    window[name] = function(code, out, err){
      if(settled) return;
      settled = true;
      clearTimeout(to);
      try{ delete window[name]; }catch(e){}
      resolve({ errno: Number(code) || 0, stdout: out === undefined ? "" : String(out),
                stderr: err === undefined ? "" : String(err) });
    };
    try{
      ksu.exec(cmd, null, name);
    }catch(e){
      clearTimeout(to);
      try{ delete window[name]; }catch(x){}
      if(!settled){ settled = true; reject(e); }
    }
  });
}

/* --- sync kopru: exec(cmd) -> stdout string (JS is parcacigini bloklar) --- */
function execSync(cmd){
  return new Promise((resolve, reject)=>{
    try{
      const r = ksu.exec(cmd);
      if(r && typeof r.then === "function"){
        r.then(v => resolve(Object.assign(
            typeof v === "string" ? {errno:0, stdout:v, stderr:""}
              : {errno:(v&&v.errno)||0, stdout:(v&&(v.stdout||v.out))||"", stderr:(v&&v.stderr)||""},
            { promise: true })))
         .catch(reject);
        return;
      }
      if(r && typeof r === "object"){
        resolve({ errno: Number(r.errno||r.code||0), stdout: String(r.stdout !== undefined ? r.stdout : (r.out||"")),
                  stderr: String(r.stderr || "") });
        return;
      }
      resolve({ errno: 0, stdout: r === undefined || r === null ? "" : String(r), stderr: "" });
    }catch(e){ reject(e); }
  });
}

function execRaw(cmd){
  if(BRIDGE === "spawn") return execSpawn(cmd);
  if(BRIDGE === "async") return execAsync(cmd);
  return execSync(cmd);
}

/* Kopru tipini BIR KEZ, zararsiz bir "ping" komutuyla tespit eder.
   Desteklenen yonetici imzalari:
     1) exec(cmd, options, callbackAdi)  -> asenkron (KernelSU/SukiSU/APatch)
     2) exec(cmd) -> stdout (string)     -> senkron (JS parcacigini bloklar)
     3) exec(cmd) -> Promise             -> KernelSU Next / KsuWebUIStandalone
   Hicbiri yoksa arayuz bunu acikca soyler. */
function probeAsync(cmd, waitMs){
  return new Promise(resolve=>{
    const name = "__ksuprobe_" + (++cbSeq);
    let done = false;
    const finish = v => {
      if(done) return;
      done = true;
      try{ delete window[name]; }catch(e){}
      resolve(v);
    };
    window[name] = function(code, o, e){
      finish({ errno: Number(code) || 0, stdout: o === undefined ? "" : String(o),
               stderr: e === undefined ? "" : String(e) });
    };
    try{ ksu.exec(cmd, null, name); }catch(e){ finish(null); return; }
    setTimeout(()=>finish(null), waitMs);
  });
}

/* ---- spawn koprusu: GERCEKTEN asenkron (JS is parcacigini bloklamaz) ----
   KernelSU 3 argumanli exec()'i senkron calistirir: Java metodu komut bitene
   kadar donmez, bu yuzden "callback'li" olsa bile JS bekler. spawn() ise
   enqueue() kullanir; cikti parca parca 'data' olarak akar, 'exit' ile biter.
   Bu yuzden once spawn denenir. */
function probeSpawn(cmd, waitMs){
  return new Promise(resolve=>{
    if(!hasKsu() || typeof ksu.spawn !== "function") return resolve(null);
    const name = "__ksuspawn_" + (++cbSeq);
    let out = "", err = "", done = false;
    const finish = v => { if(done) return; done = true; try{ delete window[name]; }catch(e){} resolve(v); };
    try{
      window[name] = {
        stdout: { emit: (ev, d)=>{ if(d !== undefined) out += (out ? "\n" : "") + String(d); } },
        stderr: { emit: (ev, d)=>{ if(d !== undefined) err += (err ? "\n" : "") + String(d); } },
        emit: (ev, arg)=>{
          if(ev === "exit"){
            finish({ errno: Number(arg) || 0, stdout: out, stderr: err, spawn: true });
          } else if(ev === "error"){
            finish({ errno: (arg && arg.exitCode) || 1, stdout: out,
                     stderr: (arg && arg.message) || err, spawn: true });
          }
        }
      };
      ksu.spawn(cmd, "[]", null, name);
    }catch(e){ finish(null); return; }
    setTimeout(()=>finish(null), waitMs);
  });
}

function execSpawn(cmd){
  return new Promise((resolve, reject)=>{
    const name = "__ksuspawn_" + (++cbSeq);
    let out = "", err = "", settled = false;
    const cleanup = ()=>{ try{ delete window[name]; }catch(e){} };
    const to = setTimeout(()=>{
      if(settled) return;
      settled = true; cleanup();
      reject(new Error("komut zaman aşımı (" + Math.round(CMD_TIMEOUT/1000) + " sn)"));
    }, CMD_TIMEOUT);
    window[name] = {
      stdout: { emit: (ev, d)=>{ if(d !== undefined) out += (out ? "\n" : "") + String(d); } },
      stderr: { emit: (ev, d)=>{ if(d !== undefined) err += (err ? "\n" : "") + String(d); } },
      emit: (ev, arg)=>{
        if(settled) return;
        if(ev === "exit"){
          settled = true; clearTimeout(to); cleanup();
          resolve({ errno: Number(arg) || 0, stdout: out, stderr: err });
        } else if(ev === "error"){
          settled = true; clearTimeout(to); cleanup();
          resolve({ errno: (arg && arg.exitCode) || 1, stdout: out,
                    stderr: (arg && arg.message) || err });
        }
      }
    };
    try{ ksu.spawn(cmd, "[]", null, name); }
    catch(e){
      clearTimeout(to); cleanup();
      if(!settled){ settled = true; reject(e); }
    }
  });
}

async function detectBridge(){
  if(!hasKsu()){ BRIDGE = "none"; return; }
  try{
    if(typeof ksu.moduleInfo === "function"){
      const mi = JSON.parse(ksu.moduleInfo());
      if(mi && mi.moduleDir){ MODDIR = String(mi.moduleDir); SCRIPT = MODDIR + "/webui.sh"; }
    }
  }catch(e){}

  const tryShell = async shell => {
    const cmd = shell + " " + SCRIPT + " ping";
    // 0) spawn (gercekten asenkron)
    const sp = await probeSpawn(cmd, 1200);
    if(sp && /OK\|/.test(sp.stdout)){ SHELL = shell; BRIDGE = "spawn"; BLOCKING = false; return true; }
    // 1) asenkron (callback'li exec)
    const r = await probeAsync(cmd, 700);
    if(r && /OK\|/.test(r.stdout)){ SHELL = shell; BRIDGE = "async"; BLOCKING = false; return true; }
    // 2/3) senkron ya da promise
    try{
      const sres = await execSync(cmd);
      if(/OK\|/.test(sres.stdout)){
        SHELL = shell;
        BRIDGE = (sres.promise ? "promise" : "sync");
        BLOCKING = BRIDGE === "sync";
        return true;
      }
    }catch(e){}
    return false;
  };

  if(await tryShell("/system/bin/sh")) return;
  if(await tryShell("sh")) return;          // bazi ortamlarda /system/bin yok
  if(await tryShell("/bin/sh")) return;
  BRIDGE = "none";
}

async function out(args){
  const cmd = SHELL + " " + SCRIPT + " " + args;
  let r;
  try{ r = await execRaw(cmd); }
  catch(e){ throw new Error((e && e.message) || String(e)); }
  let t = r.stdout || "";
  const err = r.stderr || "";
  if(err && String(err).trim()) t += (t ? "\n" : "") + "[stderr] " + String(err).trim();
  if(!t && r.errno) t = "(boş çıktı, kod " + r.errno + ")";
  return t;
}
function kvParse(txt){
  const o = {};
  String(txt||"").split("\n").forEach(l=>{
    const i = l.indexOf("|");
    if(i < 0) return;
    o[l.slice(0,i).trim()] = l.slice(i+1);
  });
  return o;
}
const sq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";

/* ---------------- biçimlendirme ---------------- */
function bytes(n){
  n = Number(n)||0;
  if(n <= 0) return "—";
  const u = ["B","KB","MB","GB"]; let i = 0;
  while(n >= 1024 && i < u.length-1){ n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n < 10 ? 1 : 0)) + " " + u[i];
}
function up(sec){
  sec = Number(sec)||0; if(!sec) return "—";
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
  if(d) return d + " gün " + h + " sa";
  if(h) return h + " sa " + m + " dk";
  return m + " dk";
}
function dt(s){
  if(!s || s === "-") return "—";
  return String(s).replace("T"," ").slice(0,19);

function appName(pkg){
  const m = MG[pkg];
  if(m && m.label) return m.label;
  if(NAMES[pkg]) return NAMES[pkg];
  const parts = String(pkg).split(".").filter(p => !["com","org","net","app","apps","android","mobile","client","id","v4","dev"].includes(p));
  const last = parts.length ? parts[parts.length-1] : pkg;
  return last.charAt(0).toUpperCase() + last.slice(1);
}

async function enrichFromManager(){
  if(!hasKsu() || typeof ksu.getPackagesInfo !== "function") return;
  try{
    const names = APPS.map(a=>a.pkg);
    for(let i=0;i<names.length;i+=150){
      const part = names.slice(i, i+150);
      let arr = null;
      try{ arr = JSON.parse(ksu.getPackagesInfo(JSON.stringify(part))); }
      catch(e){ return; }
      if(!Array.isArray(arr)) return;
      arr.forEach(o=>{
        if(!o || o.error || !o.packageName) return;
        MG[o.packageName] = {
          label: o.appLabel || "",
          versionName: o.versionName || "",
          versionCode: o.versionCode || "",
          isSystem: !!o.isSystem
        };
      });
    }
    ICONS = (typeof ksu.listPackages === "function");
  }catch(e){ /* yonetici desteklemiyor -> yedek yol */ }
}
function appColor(pkg){
  let h = 0;
  for(let i=0;i<pkg.length;i++) h = (h*31 + pkg.charCodeAt(i)) % 360;
  return "hsl(" + h + " 58% 42%)";
}
/* ============================================================
   v2.8.1 — UYGULAMA LOGOLARI (gerçekten çalışan motor)
   ------------------------------------------------------------
   Neden v2.7'de logo gelmiyordu?
     1) `ksu://icon/` isteği HİÇ denemiyordu: yalnızca
        `ksu.getPackagesInfo` varsa (ICONS=true) logoya geçiliyordu.
        SukiSU Ultra'nın WebUI köprüsünde bu fonksiyon yoksa
        liste baştan harf kutusuna düşüyordu.
     2) `loading="lazy"` yüzünden ekran dışındaki satırların <img>
        isteği, liste sürekli yeniden çizildiği için hiç başlamıyordu.
     3) Yedek şema sırası sabitti; hangisinin çalıştığı hiç ölçülmüyordu.

   Şimdi: açılışta iki şema da GERÇEKTEN denenir (1x1 görünmez prob),
   hangisi çalışıyorsa o kullanılır, ölçüm sonucu Durum sekmesinde ve
   "logo testi" düğmesinde gösterilir. Hiçbiri çalışmazsa harf kutusu.
   ============================================================ */
const ICON_SCHEMES = ["ksu://icon/", "mui://icon/"];
let ICON_BASE = "ksu://icon/";     // kazanan şema
let ICON_PROBED = false;           // prob koştu mu
let ICON_STATE = {                 // Durum sekmesinde gösterilir
  ksu: "denenmedi", mui: "denenmedi", ok: 0, bad: 0
};

/* tek şemayı görünmez bir Image ile dene (1.2 sn süre sınırı) */
function probeScheme(base, pkg){
  return new Promise(resolve => {
    if(typeof Image !== "function") return resolve(false);
    let done = false;
    const img = new Image();
    const fin = ok => { if(!done){ done = true; resolve(ok); } };
    const to = setTimeout(()=>fin(false), 1200);
    img.onload  = () => { clearTimeout(to); fin(img.naturalWidth > 1); };
    img.onerror = () => { clearTimeout(to); fin(false); };
    img.src = base + (pkg || "com.android.settings");
  });
}

/* ikon motorunu seç: sırayla dene, ilk çalışan kazanır */
async function initIcons(force){
  if(ICON_PROBED && !force) return ICON_BASE;
  ICON_PROBED = true;
  for(const base of ICON_SCHEMES){
    const key = base === "ksu://icon/" ? "ksu" : "mui";
    const ok = await probeScheme(base);
    ICON_STATE[key] = ok ? "çalışıyor" : "yok";
    if(ok){ ICON_BASE = base; return ICON_BASE; }
  }
  ICON_STATE.ksu = ICON_STATE.ksu === "çalışıyor" ? "çalışıyor" : "yok";
  return ICON_BASE;
}
function iconURL(pkg){
  return ICON_BASE + pkg;
}
function appColor(pkg){
  let h = 0;
  for(let i=0;i<pkg.length;i++) h = (h*31 + pkg.charCodeAt(i)) % 360;
  return "hsl(" + h + " 58% 42%)";
}
/* logo: base şema -> diğer şema -> harf. lazy YOK (yuklenmesin diye bekliyordu). */
function avatar(pkg){
  const raw = (appName(pkg) || "?");
  const ch = esc((raw.trim()[0] || "?").toUpperCase());
  const alt = ICON_BASE === "ksu://icon/" ? "mui://icon/" : "ksu://icon/";
  return `<div class="ava" style="background:${appColor(pkg)}">
    <img class="avimg" src="${iconURL(esc(pkg))}" alt="" decoding="async"
         data-alt="${alt}${esc(pkg)}" onerror="avFallback(this)">
    <span class="avtxt" style="display:none">${ch}</span></div>`;
}
let ICON_OK = 0, ICON_BAD = 0;   // kaç logo yüklendi / kaç tanesi harfe düştü
document.addEventListener("load", function(ev){
  const t = ev.target;
  if(t && t.tagName === "IMG" && t.classList && t.classList.contains("avimg")) ICON_OK++;
}, true);
document.addEventListener("error", function(ev){
  const t = ev.target;
  if(t && t.tagName === "IMG" && t.classList && t.classList.contains("avimg")){
    try{ avFallback(t); }catch(e){}
  }
}, true);

function avFallback(img){
  try{
    if(img.dataset.step === "1"){ throw 0; }         // 2. şema da olmadı
    const alt = img.getAttribute("data-alt");
    if(alt){ img.dataset.step = "1"; img.src = alt; return; }
    throw 0;
  }catch(e){
    ICON_BAD++;
    img.style.display = "none";
    const p = img.parentNode, t = p && p.querySelector(".avtxt");
    if(t) t.style.display = "";
  }
}

  const rows = [], on = {};
  String(txt||"").split("\n").forEach(l => {
    if(l.indexOf("#ondeki|") === 0){ on.ondeki = l.slice(9); return; }
    if(l.charAt(0) === "#" || !l.trim()) return;
    const a = l.split("|");
    if(a.length >= 6) rows.push(a);
  });
  return {rows: rows, ondeki: on.ondeki || "-"};

function durumPill(id, d){
  const d2 = (d||"").trim();
  let ok = false, bad = false;
  if(["acik","kapali","etkin","duraklatildi","smart","all","off","whitelist","lock","sensor","1","0","var"].indexOf(d2) < 0){
    ok = d2 !== "-";
  }
  if(id === "yatay-kilit") ok = (d2 === "acik");
  else if(id === "izleyici") ok = (d2 === "acik");
  else if(id === "orta-pencere") ok = (d2 === "kapali");
  else if(id === "modul") ok = (d2 === "etkin");
  else if(id === "resizable") ok = (d2 === "1");
  else if(id === "letterbox") ok = (d2 !== "off");
  else if(id === "yon-modu") ok = (d2 !== "off");
  else if(id === "ekrana-yay" || id === "mailbox") ok = !/^0 /.test(d2);
  bad = !ok && d2 !== "-";
  return `<span class="pill ${ok ? "ok" : (bad ? "bad" : "")}">${esc(d2 || "—")}</span>`;

/* ---------------- UYGULAMALAR ---------------- */
function filteredApps(){
  let a = APPS.slice();
  const q = Q.trim().toLowerCase();
  if(q) a = a.filter(x => x.pkg.toLowerCase().includes(q) || appName(x.pkg).toLowerCase().includes(q));
  if(FILTER === "force") a = a.filter(x => x.dec === "force");
  else if(FILTER === "skip") a = a.filter(x => x.dec === "skip");
  else if(FILTER === "applied") a = a.filter(x => x.applied);
  else if(FILTER === "degil") a = a.filter(x => !x.applied);
  else if(FILTER === "am") a = a.filter(x => x.am);
  const rank = x => x.dec === "force" ? 0 : 1;
  a.sort((x,y)=>{
    if(SORT === "boyut") return (y.size||0) - (x.size||0);
    if(SORT === "durum") return rank(x)-rank(y) || appName(x.pkg).localeCompare(appName(y.pkg));
    return appName(x.pkg).localeCompare(appName(y.pkg));
  });
  return a;
}
function appRow(a){
  const badges = [];
  badges.push(a.dec === "force" ? `<span class="b force">yatay zorlanır</span>` : `<span class="b skip">dokunulmaz</span>`);
  if(a.applied) badges.push(`<span class="b ok">uygulandı</span>`);
  if(a.am){
    const ok = (a.amst === "ok" || a.amst === "");
    badges.push(`<span class="b am">ekrana yayıldı${ok ? "" : " · doğrulanamadı"}</span>`);
  }
  if(a.ori !== "unknown") badges.push(`<span class="b">${esc(oriTR(a.ori))}</span>`);
  const mv = (MG[a.pkg] && MG[a.pkg].versionName) || (a.ver && a.ver !== "-" ? a.ver : "");
  const meta = [mv ? "v"+mv : "", a.size ? bytes(a.size) : ""].filter(Boolean).join(" · ");
  return `<div class="app">
    ${avatar(a.pkg)}
    <div class="aname" data-detail="${esc(a.pkg)}">
      <div class="n">${esc(appName(a.pkg))}</div>
      <div class="p">${esc(a.pkg)}${meta ? " · " + esc(meta) : ""}</div>
      <div class="badges">${badges.join("")}</div>
    </div>
    <div class="iacts">
      <button class="sm act ${a.dec==="force"?"on":""}" data-force="${esc(a.pkg)}"
        title="Yatay zorla: dikey kilidini kaldır, sensörü takip et"><span class="ic">↔️</span><span class="cap">yatay</span></button>
      <button class="sm act ${a.am?"on":""}" data-appmode="${esc(a.pkg)}" data-am="${a.am?"1":"0"}"
        title="Ekrana yay (tam ekran yatay): sağ-sol bantlar kalkar, uygulama ekranı doldurur"><span class="ic">⤢</span><span class="cap">yay</span></button>
      <button class="sm act ${a.dec==="skip"?"on":""}" data-never="${esc(a.pkg)}"
        title="Dokunma: bu uygulamaya hiç karışma"><span class="ic">🚫</span><span class="cap">bırak</span></button>
      <button class="sm act" data-detail="${esc(a.pkg)}"
        title="Ayrıntı: bilgi, aç, durdur"><span class="ic">ℹ️</span><span class="cap">bilgi</span></button>
    </div>
  </div>`;
}
function appRows(){

  if(!a.length) return `<div class="centered">eşleşen uygulama yok<br><span class="hint">arama/filtreyi değiştir</span></div>`;
  return a.map(appRow).join("");

  </div>`;

async function fillLog(){
  const box = $("logbox");
  if(!box) return;
  try{
    const txt = await out("logs " + LOGSRC + " " + LOGN);
    let lines = String(txt).split("\n");
    if(LOGQ.trim()){
      const q = LOGQ.trim().toLowerCase();
      lines = lines.filter(l=>l.toLowerCase().includes(q));
    }
    const body = lines.join("\n").trim();
    box.textContent = body || "(kayıt yok — yukarıdaki kaynak/filtre boş döndü)";
    COPY.log = body;
    box.scrollTop = box.scrollHeight;
  }catch(e){
    box.textContent = "log alınamadı: " + (e.message || e);
  }
}
function startLogAuto(){
  stopLogAuto();
  logTimer = setInterval(async ()=>{
    if(TAB !== "kayitlar" || busy || document.hidden) return;
    await fillLog();
  }, 5000);
}
function stopLogAuto(){ if(logTimer){ clearInterval(logTimer); logTimer = null; } }

let SYS = {};

  const g = k => {
    const v = (SYS || {})[k];

    return t;
  };
  const n = k => { const v = parseInt(g(k), 10); return isNaN(v) ? null : v; };

                 .filter(k => g(k)).length;
  if(!var_mi || dolu === 0){
    return `<div class="warnbox"><b>Cihaz bilgileri okunamadı.</b>

    ${row("SELinux", g("selinux"))}

  <div class="card">

    <div class="row" style="justify-content:space-between"><span class="hint">RAM</span>
      <b>${ramT ? bytes((ramT - (ramB || 0)) * 1024) + " / " + bytes(ramT * 1024) : "—"}</b></div>
    ${ramPct !== null ? `<div class="bar"><i style="width:${ramPct}%"></i></div>` : ""}
    <div class="row" style="justify-content:space-between;margin-top:6px"><span class="hint">/data</span>
      <b>${dT ? bytes(dD * 1024) + " / " + bytes(dT * 1024) : "—"}</b></div>

/* Uygulama içi onay penceresi. window.confirm() WebView'de
   desteklenmeyebilir; desteklenmiyorsa sessizce "iptal" döner ve
   düğmeler hiçbir şey yapmıyormuş gibi görünür. Bu yüzden kendi
   penceremizi kullanıyoruz. */
function askConfirm(title, text, okLabel){
  return new Promise(resolve=>{
    const host = $("sheetHost");
    host.innerHTML = `<div class="sheet" data-ask="1"><div class="box">
      <div style="font-weight:700;font-size:16px;margin-bottom:6px">${esc(title)}</div>
      <div class="hint" style="margin-bottom:14px">${esc(text)}</div>
      <div class="row">
        <button class="danger" data-ask-ok="1">${esc(okLabel || "Evet, yap")}</button>
        <button class="ghost" data-ask-no="1">Vazgeç</button>
      </div>
    </div></div>`;
    const done = v => { host._askDone = null; host.innerHTML = ""; resolve(v); };
    host._askDone = done;   // v2.8.1: dışarı tıklamada da (data-close) false ile çözülür
  });
}
document.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-ask-ok],[data-ask-no]");
  if(!t) return;
  const host = $("sheetHost");
  const done = host._askDone;
  if(typeof done === "function"){ host._askDone = null; done(!!t.dataset.askOk); }
});

function copyText(t, okMsg){
  const s = String(t || "");
  const done = ()=>toast(okMsg || "kopyalandı");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(done).catch(()=>fallbackCopy(s, done));
  } else fallbackCopy(s, done);
}
function fallbackCopy(s, done){
  try{
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }catch(e){ toast("kopyalanamadı — metni seçip elle kopyala"); }
}

async function doApply(){
  busyStart("hazırlanıyor…");
  let guard = 0, more = "1", applied = 0, kalan = "?", hata = 0, sonKalan = -1, ayni = 0;
  try{
    while(more === "1" && guard++ < 80){
      const CH = BLOCKING ? 6 : 15;
      const arg = (guard === 1 ? "apply-chunk " + CH : "apply-chunk " + CH + " devam");
      const raw = await out(arg);
      const o = kvParse(raw);
      if(!o.durum && guard === 1){
        lastErr = (raw || "(boş çıktı)").split("\n").slice(0,2).join(" ").slice(0,160);
        break;
      }
      if(o.uygulanan) applied = o.uygulanan;
      if(o.kalan !== undefined) kalan = o.kalan;
      if(o.basarisiz) hata = parseInt(o.basarisiz,10) || hata;
      more = (o.devam || "0").trim();
      busyText = "letterbox uygulanıyor… " + applied + " paket · kalan " + kalan + (hata ? (" · hata " + hata) : "");
      paintBusy();
      const kn = parseInt(kalan,10);
      if(kn === sonKalan) { if(++ayni >= 2) break; } else { ayni = 0; sonKalan = kn; }
      if(!o.uygulanan && !o.kalan && guard > 1) break;
    }
  }catch(e){ lastErr = e.message || String(e); }
  if(hata > 0) NOTICE = hata + " pakette hata oluştu — Letterbox sekmesinde sebebini görebilirsin.";
  busyEnd();
  try{ await loadStatus(); await loadApps(); CSTAT = []; }catch(e){}
  await render();
  toast(lastErr ? ("hata: " + lastErr)
    : (hata > 0 ? ("bitti — " + applied + " uygulandı, " + hata + " hata")
                : ("bitti — uygulanan: " + applied)));
  lastErr = "";
}

async function setApp(pkg, val){
  const nm = appName(pkg);
  busyStart((val === "force" ? "yatay zorlanıyor: " : val === "never" ? "dokunulmaz: " : "otomatik: ") + nm);
  let sonuc = "";
  try{
    const r = await out("set " + sq(pkg) + " " + val);
    const bad = String(r||"").split("\n").find(l => l.startsWith("HATA"));
    if(bad){
      /* geri alma DOĞRULANAMADI -> gerçeği söyle, "tamam" deme */
      sonuc = "olmadı: " + bad.replace("HATA|","").replace(/[|]/g," · ");
    } else if(val === "force"){
      /* v2.14: 'set force' artik TUM katmanlari kendisi uygular;
         cikti hangi katmanin ne oldugunu soyler, onu goster. */
      const okL = String(r||"").split("\n").find(l => l.startsWith("OK|"));
      sonuc = okL ? ("yatay zorlandı ✓ " + (okL.split("|").slice(3).join(" ") || ""))
                  : "cevap yok — durumu kontrol et";
    } else {
      sonuc = (val === "never" ? "dokunma — katman geri alındı" : "otomatik");
    }
    await loadApps();
  }catch(e){ sonuc = "hata: " + (e.message || e); }
  busyEnd();
  await render();
  toast(nm + " → " + sonuc);
}

/* v2.7: uygulama basina "ekrana yay" (komple yatay / tam ekran) */
async function setAppMode(pkg, on){
  const nm = appName(pkg);
  busyStart((on ? "ekrana yayılıyor: " : "eski hâline dönüyor: ") + nm);
  try{
    const r = await out("appmode " + sq(pkg) + " " + (on ? "on" : "off"));
    const bad = String(r||"").split("\n").find(l => l.startsWith("HATA"));
    if(bad) throw new Error(bad.replace("HATA|",""));
    await loadApps();
    let gercek = "";
    try{ const v = kvParse(await out("verify " + sq(pkg))); gercek = v.pencere || ""; }catch(e){}
    if(on){
      toast(nm + (gercek.indexOf("orta|") === 0
        ? " → ayar açıldı ama MIUI hâlâ ortada tutuyor (orta pencereyi kapat)"
        : " → ekrana yayıldı"));
    } else {
      toast(nm + " → eski hâline döndü");
    }
  }catch(e){
    toast("olmadı: " + (e.message || e));
  }
  busyEnd();
  await render();
}

/* v2.8: "gerçek durum" satırları — sistemden okunan değerleri Türkçeye çevirir.
   Ayrı fonksiyon: test edilebilir, tek yerde mantık. */
function stTR(s){
  if(s === "enabled") return "açık ✓";
  if(s === "disabled") return "kapalı ✗";
  /* v2.13: "unknown" artik "kayıt yok" demek — uygulanmamış olabilir,
     ama "okunamadı" demek yanlıştı: komut calisti, kayit yoktu. */
  if(s === "unknown" || s === "uygulanmadi") return "kayıt yok";
  return "okunamadı";
}
function winTR(w){
  if(w === "kapali") return "uygulama kapalı — açıp ölç";
  if(!w || w === "?") return "ölçülemedi (pencere yok)";
  if(w === "tam") return "tam ekran ✓";
  if(w.indexOf("orta|") === 0) return "ortada (" + w.slice(5) + ") ✗";
  return w;
}
/* v2.11: MIUI "信箱模式" — uygulamayi ekranin ORTASINDA telefon
   oraninda bir sutuna koyan davranis. AOSP compat anahtarlari bunu
   kaldirmaz; MIUI'nin kendi kural dosyasi kaldirir. */
function mbTR(s){
  if(s === "kapali")     return "kapalı ✓ (sütun kalkar)";
  if(s === "aktif")      return "AÇIK — uygulama ortada kalır ✗";
  if(s === "varsayilan") return "AÇIK (varsayılan) — kapatılmalı ✗";
  if(s === "yok")        return "kural dosyası yok (bu ROM'da mailbox yok)";
  return "okunamadı";
}
function krTR(s){
  if(!s) return "okunamadı";
  if(s === "yok") return "yok";
  if(s.indexOf("var|hemen") === 0) return "var ✓ (dosyada; canlı komut/açılışla okunur)";
  if(s.indexOf("var|") === 0) return "var · yeniden başlatınca geçerli";
  return s;
}
function realStateRows(real){
  const r = real || {};
  const lbk = r.letterbox_kaynak ? ` · kaynak: ${r.letterbox_kaynak}` : "";
  return [
    ["letterbox (resize)", stTR(r.letterbox) + lbk],
    ["ekrana yay · kapıcı", stTR(r.yay_OVERRIDE_MIN_ASPECT_RATIO)],
    ["ekrana yay · 16:9", stTR(r.yay_OVERRIDE_MIN_ASPECT_RATIO_LARGE)],
    ["pencere", winTR(r.pencere)],
    ["MIUI motoru (kural servisi)", r.miui_embed === "acik" ? "AÇIK ✓ (kurallar işlenir)" : (r.miui_embed === "kapali" ? "KAPALI ✗ — uygulamaya özel kurallar işlenmez, yeniden başlat" : "bilinmiyor")],
    ["MIUI mailbox (orta sütun)", mbTR(r.mailbox)],
    ["yatay kuralı (fullRule)", krTR(r.yatay_kural)]
  ];
}

     v2.7'deki gibi tek komut takılırsa bütün ayrıntı ekranı beklemiyor. */
  (async () => {
    let real = {};
    try{ real = kvParse(await out("verify " + sq(pkg))); }catch(e){ real = {}; }
    const el = $("sheetReal");
    if(!el) return;                      // pencere kapanmış

    el.innerHTML = rows.map(([k,v])=>kv(k,v)).join("") + uyari;
  })();
}

async function appAction(cmd, pkg, label){
  try{
    const r = await out(cmd + " " + sq(pkg));
    const o = kvParse(r);
    toast(label + ": " + (o.OK === undefined ? (o.HATA || "tamam") : (o.OK.split("|")[2] || "tamam")));
    await loadApps();
  }catch(e){ toast(e.message || e); }
  $("sheetHost").innerHTML = "";
  await render();
}

    busyStart("tam kontrol çalışıyor… (birkaç saniye)");
    let txt = "", kd = "";
    try{ txt = await out("tamkontrol"); }catch(e){ txt = String((e&&e.message)||e); }
    busyEnd();
    const lines = String(txt||"").split("\n");
    const kontrol = lines.filter(l => /^[a-z-]+\|/.test(l) && l.split("|").length >= 6).length;
    const kOk = (String(txt).match(/^KONTROL\|OK\|/gm)||[]).length;
    const kUy = (String(txt).match(/^UYARI\|/gm)||[]).length;
    const kHa = (String(txt).match(/^KONTROL\|HATA\|/gm)||[]).length;
    const son = lines.find(l => l.indexOf("SONUC|") === 0) || "SONUC|KANIT-YOK|cevap yok";
    const sp = son.split("|");
    const hukum = sp[1], sebep = sp.slice(2).join(" ");
    const iyi = (kHa === 0 && hukum === "CALISIYOR");
    const renk = iyi ? "okbox" : "warnbox";
    const host = $("tamHost");
    if(host) host.innerHTML = `
      <div class="${renk}" style="margin-bottom:12px">
        <b>TAM KONTROL sonucu:</b> ${kontrol} anahtar · tanı ${kOk} OK / ${kUy} uyarı / ${kHa} hata ·
        öndeki uygulama hükmü <b>${esc(hukum)}</b>${sebep ? " — " + esc(sebep) : ""}

    toast(iyi ? "TAM KONTROL: her şey yerinde ✓" : ("TAM KONTROL: " + hukum + " — uyarıları gör"));

/* Her ACT çağrısından sonra "işlem sürüyor" ekranı KESİN kapanır.
   (Bir komut hata fırlatsa bile ekran kilitli kalmaz.) */
Object.keys(ACT).forEach(k => {
  const f = ACT[k];
  ACT[k] = async function(){
    try{ return await f.apply(this, arguments); }
    catch(e){ lastErr = (e && e.message) || String(e); try{ toast("hata: " + lastErr); }catch(x){} }
    finally{ try{ busyEnd(); }catch(x){} try{ await render(); }catch(x){} }
  };
});


/* ============================================================
   OLAYLAR
   ============================================================ */
document.addEventListener("click", async ev=>{
  const t = ev.target.closest("[data-tab],[data-act],[data-filter],[data-sort],[data-logsrc],[data-logn],[data-mode],[data-rotate],[data-force],[data-never],[data-auto],[data-appmode],[data-detail],[data-open],[data-stop],[data-restart],[data-copy],[data-close],[data-live],[data-fullscreen],[data-mailbox],[data-kesin],[data-ctl],[data-hepsi],[data-hepsikapat],[data-proof],[data-softreboot]");
  if(!t) return;
  const d = t.dataset;

  if(d.close){
    const _h = $("sheetHost");
    if(typeof _h._askDone === "function"){ const _f = _h._askDone; _h._askDone = null; _f(false); return; }
    _h.innerHTML = "";
    return;
  }
  if(d.live !== undefined){
    busyStart("canlı ölçüm…");
    try{ const s = await out("status-full"); ST = Object.assign(ST, kvParse(s)); }catch(e){}
    busyEnd(); await loadStatus(); await render(); toast("canlı ölçüm alındı"); return;
  }
  if(d.copy){ copyText(d.copy); return; }
  if(d.tab){ await setTab(d.tab); return; }
  if(d.filter){ FILTER = d.filter; await render(); return; }
  if(d.sort){ SORT = d.sort; await render(); return; }
  if(d.logsrc){ LOGSRC = d.logsrc; await render(); return; }
  if(d.logn){ LOGN = parseInt(d.logn,10) || 300; await render(); return; }
  if(d.mode){
    busyStart("mod değiştiriliyor…");
    try{ await out("mode " + d.mode); await loadStatus(); await loadApps(); }catch(e){ toast(e.message||e); }
    busyEnd(); await render(); toast("mod: " + d.mode); return;
  }
  if(d.rotate){
    busyStart("yön uygulanıyor…");
    let sonuc = "";
    try{
      const r = await out("rotate " + d.rotate);
      const ilk = String(r||"").split("\n")[0] || "";
      if(ilk.indexOf("OK|") === 0){
        const par = ilk.split("|");
        await loadStatus();
        sonuc = "yön modu: " + (par[1] || d.rotate) + " ✓ (" + par.slice(2).join(" · ") + ")";
      } else if(ilk.indexOf("HATA") === 0){
        sonuc = "olmadı: " + ilk.replace(/^HATA\|?/, "").replace(/\|/g, " · ");
      } else {
        sonuc = "cevap yok (arka uç çalışmadı)";
      }
    }catch(e){ sonuc = "hata: " + (e.message||e); }
    busyEnd(); await render(); toast(sonuc); return;
  }
  if(d.force){ await setApp(d.force, "force"); return; }
  if(d.never){ await setApp(d.never, "never"); return; }
  if(d.appmode){ await setAppMode(d.appmode, d.am !== "1"); return; }
  if(d.auto){ await setApp(d.auto, "auto"); return; }
  if(d.proof){
    busyStart("MIUI kural dosyaları okunuyor…");
    let txt = "";
    try{ txt = await out("proof " + sq(d.proof)); }catch(e){ txt = String((e && e.message) || e); }
    busyEnd();
    const lines = String(txt || "").split("\n").filter(Boolean);
    const el = $("sheetReal");
    if(el){
      el.innerHTML = lines.map(l => {
        const p = l.split("|");
        if(p[0] === "dosya")
          return kv(p[1].split("/").pop(), p[2] === "yok"
            ? "yok ✗"
            : `${p[3]} · ${p[4]} · ${p[5]}`);
        return `<div class="hint mono" style="word-break:break-all">${esc(l.slice(6))}</div>`;
      }).join("") || `<div class="hint">kanıt satırı yok</div>`;
    }
    const satir = lines.filter(l => l.indexOf("satir|") === 0).length;
    toast(satir ? ("kural kanıtı: " + satir + " satırımız dosyada ✓") : "kural kanıtı: dosyalarda bizim satırımız yok");
    return;
  }
  if(d.softreboot){
    if(!await askConfirm("Kuralları zorla yükle?",
      "MIUI kendi kural dosyalarını yalnızca açılışta okur. Zygote tazelenir: ekran ~20 sn kararır, sistem yeniden başlar gibi olur. Verilerin silinmez.",
      "Tazele")) return;
    busyStart("zygote tazeleniyor…");
    let r = "";
    try{ r = await out("softreboot"); }catch(e){ r = String((e && e.message) || e); }
    busyEnd();
    toast(String(r || "").replace(/\|/g, " · "));
    return;
  }
  if(d.fullscreen){
    busyStart("tam ekran yapılıyor…");
    try{
      const r = await out("fullscreen " + sq(d.fullscreen));
      const bad = String(r||"").split("\n").find(l => l.startsWith("HATA"));
      if(bad) throw new Error(bad.replace(/^HATA\|/,"").replace(/\|/g," · "));
      toast(appName(d.fullscreen) + " → tam ekran ✓");
      LAST_OP = "tam ekran: " + d.fullscreen + " · " + new Date().toLocaleTimeString("tr-TR");
    }catch(e){
      const m = String((e && e.message) || e);
      toast(/gorev-yok/.test(m) ? "önce uygulamayı aç, sonra tekrar bas" : ("olmadı: " + m));
      LAST_OP = "tam ekran olmadı: " + m;
    }
    busyEnd(); try{ await loadStatus(); }catch(e){} await render();
    return;
  }
  if(d.ctl){
    busyStart(d.ctlname + " → " + d.ctl + "…");
    try{
      const r = await out(d.ctl);
      const bad = String(r||"").split("\n").find(l => l.startsWith("HATA"));
      if(bad) throw new Error(bad.replace(/^HATA\|/,"").replace(/\|/g," · "));
      await loadKontrol();
      toast(d.ctlname + ": " + (String(r||"").split("\n")[0].replace(/\|/g," · ")));
      LAST_OP = d.ctl + " · " + new Date().toLocaleTimeString("tr-TR");
    }catch(e){ toast("olmadı: " + (e.message||e)); }
    busyEnd(); try{ await loadStatus(); }catch(e){} await render();
    return;
  }
  if(d.hepsi || d.hepsikapat){
    const pkg2 = d.hepsi || d.hepsikapat;
    const cmd = d.hepsi ? "uygula-hepsi" : "kapat-hepsi";
    busyStart((d.hepsi ? "her şey uygulanıyor…" : "her şey geri alınıyor…") + " " + appName(pkg2));
    let txt = "";
    try{ txt = await out(cmd + " " + sq(pkg2)); }
    catch(e){ txt = String((e && e.message) || e); }
    busyEnd();
    const lines = String(txt||"").split("\n").filter(l => l.indexOf("ADIM|") === 0 || l.indexOf("SONUC|") === 0 || l.indexOf("HATA") === 0);
    const son = lines.find(l => l.indexOf("SONUC|") === 0) || "SONUC|OLMADI|cevap yok";
    const sp = son.split("|"), hukum = sp[1], sebep = sp.slice(2).join(" ");
    const metin = lines.map(l => {
      const a = l.split("|");
      if(a[0] === "SONUC") return "HÜKÜM: " + a[1] + " — " + a.slice(2).join(" ");
      return (a[2] === "OK" ? "✓ " : a[2] === "KANIT-YOK" ? "? " : a[2] === "UYARI" ? "! " : a[2] === "HATA" ? "✗ " : "· ")
             + a[3] + ": " + (a.slice(4).join("|") || "");
    }).join("\n");
    toast((hukum === "CALISIYOR" ? "✔ " : hukum === "KANIT-YOK" ? "? " : "✗ ") + appName(pkg2) + " → " + hukum + " · " + sebep);
    LAST_OP = cmd + ": " + pkg2 + " → " + hukum + " · " + new Date().toLocaleTimeString("tr-TR");
    const host = $("sheetReal");
    if(host) host.innerHTML = `<pre class="hint mono" style="white-space:pre-wrap;margin:0">${esc(metin)}</pre>`
      + `<div class="${hukum === "CALISIYOR" ? "okbox" : "warnbox"}" style="margin-top:9px">HÜKÜM: <b>${esc(hukum)}</b> — ${esc(sebep)}</div>`
      + (hukum !== "CALISIYOR" ? `<div class="hint" style="margin-top:6px">Olmadıysa: <b>Ayarlar → Rapor oluştur</b> ve dosyayı gönder; ayrıca bir kez yeniden başlatıp tekrar dene.</div>` : "");
    try{ await loadApps(); }catch(e){}
    await render();
    return;
  }
  if(d.kesin){
    busyStart("kesin test çalışıyor…");
    let txt = "";
    try{ txt = await out("kesin " + sq(d.kesin)); }
    catch(e){ txt = String((e && e.message) || e); }
    busyEnd();
    const lines = String(txt||"").split("\n").filter(l => l.indexOf("ADIM|") === 0 || l.indexOf("SONUC|") === 0);
    const son = lines.find(l => l.indexOf("SONUC|") === 0) || "SONUC|OLMADI|cevap yok";
    const p = son.split("|");
    const durum = p[1], sebep = p.slice(2).join(" ");
    const adimlar = lines.filter(l => l.indexOf("ADIM|") === 0).map(l => {
      const a = l.split("|");
      return (a[2] === "OK" ? "✓ " : a[2] === "KANIT-YOK" ? "? " : a[2] === "UYARI" ? "! " : "✗ ")
             + a[3] + ": " + (a[4] || "");
    }).join("\n");
    LAST_OP = "kesin test: " + d.kesin + " → " + durum + " · " + new Date().toLocaleTimeString("tr-TR");
    toast(durum === "CALISIYOR" ? ("✔ " + appName(d.kesin) + " çalışıyor — " + sebep)
        : durum === "KANIT-YOK" ? ("? " + appName(d.kesin) + " — " + sebep)
        : ("✗ " + appName(d.kesin) + " olmadı — " + sebep));
    const host = $("sheetReal");
    if(host) host.innerHTML = `<pre class="hint" style="white-space:pre-wrap;font-family:monospace;margin:0">${esc(adimlar)}</pre>`
      + `<div class="${durum === "CALISIYOR" ? "okbox" : "warnbox"}" style="margin-top:9px">HÜKÜM: <b>${esc(durum)}</b> — ${esc(sebep)}</div>`;
    await render();
    return;
  }
  if(d.mailbox){
    busyStart("MIUI mailbox kapatılıyor…");
    try{
      const r = await out("mailbox " + sq(d.mailbox) + " ac");
      const bad = String(r||"").split("\n").find(l => l.startsWith("HATA"));
      if(bad) throw new Error(bad.replace(/^HATA\|/,""));
      toast(appName(d.mailbox) + " → mailbox kapalı ✓ · şimdi “↻ yeniden başlat”");
      LAST_OP = "mailbox kapatıldı: " + d.mailbox;
    }catch(e){ toast("olmadı: " + (e.message || e)); }
    busyEnd(); await render();
    return;
  }
  if(d.detail){ await openAppSheet(d.detail); return; }
  if(d.open){ await appAction("app-start", d.open, "açıldı"); return; }
  if(d.stop){ await appAction("app-stop", d.stop, "durduruldu"); return; }
  if(d.restart){ await appAction("app-restart", d.restart, "yeniden başlatıldı"); return; }
  if(d.act){
    if(typeof ACT[d.act] !== "function"){
      toast("bu düğme bu sürümde tanımlı değil: " + d.act);
      return;
    }
    // HANGI durumda olursa olsun: islem biter, "islem suruyor" ekrani ASLA kilitli kalmaz
    try{ await ACT[d.act](); }
    catch(e){ lastErr = (e && e.message) || String(e); toast("hata: " + lastErr); }
    finally{ busyEnd(); try{ await render(); }catch(e){} }
    return;
  }
});

document.addEventListener("input", ev=>{
  const t = ev.target;
  if(t.id === "q"){
    Q = t.value;
    const box = $("applist");
    if(box){ box.innerHTML = appRows(); }
  } else if(t.id === "logq"){
    LOGQ = t.value;
    clearTimeout(t._h);
    t._h = setTimeout(()=>fillLog(), 350);
  } else if(t.id === "cq"){
    const q = t.value.toLowerCase();
    const box = $("cstatList");
    if(box && box.querySelectorAll) box.querySelectorAll(".kv").forEach(el=>{
      el.style.display = el.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  }
});

/* klavye kısayolu: Esc ile pencereyi kapat */
document.addEventListener("keydown", ev=>{
  if(ev.key === "Escape" && $("sheetHost").innerHTML){ $("sheetHost").innerHTML = ""; }
});

/* Android geri tuşu: açık pencere varsa önce onu kapat,
   yoksa normal davranış (sayfadan çık). */
function pushSheetHistory(){
  try{ history.pushState({ sheet: 1 }, ""); }catch(e){}
}
window.addEventListener("popstate", ()=>{
  if($("sheetHost").innerHTML){ $("sheetHost").innerHTML = ""; }
});

$("btnRefresh").addEventListener("click", async ()=>{
  try{ await loadStatus(); }catch(e){}
  if(TAB === "uygulamalar"){ try{ await loadApps(); }catch(e){} }
  if(TAB === "letterbox"){ CSTAT = []; try{ await loadCstat(); }catch(e){} }
  if(TAB === "cihaz"){ try{ await loadSys(); }catch(e){} }
  await renderTabs();
  await render();
  toast("yenilendi");
});

/* ============================================================
   AÇILIŞ
   ============================================================ */
(async function boot(){
  renderTabs();
  if(!hasKsu()){
    $("view").innerHTML = `<div class="badbox"><b>KernelSU köprüsü yok.</b>
      <div class="hint" style="margin-top:8px">Bu sayfa SukiSU Ultra / KernelSU yöneticisinin
      <b>WebUI</b> penceresinde açılmalı. Tarayıcıda açtıysan sistem komutları çalışmaz.</div></div>`;
    return;
  }
  await detectBridge();
  if(BRIDGE === "none"){
    $("view").innerHTML = `<div class="badbox"><b>Komut köprüsü kurulamadı.</b>
      <div class="hint" style="margin-top:8px">Yönetici sürümü WebUI komutlarını desteklemiyor olabilir.
      Modülün Action düğmesini kullanabilirsin.</div></div>`;
    return;
  }
  try{
    await loadStatus();
  }catch(e){
    $("view").innerHTML = `<div class="badbox"><b>Arka uca ulaşılamadı.</b><br>${esc(e.message||e)}
      <div class="hint" style="margin-top:8px">Bu sayfa KernelSU/SukiSU yöneticisinin WebUI penceresinde açılmalı.
      Tarayıcıda açtıysan köprü çalışmaz.</div></div>`;
    return;
  }
  /* v2.8.1: logo motorunu AÇILIŞTA ölç (ksu://icon vs mui://icon).
     Ölçüm yapılmadan liste çizilirse logolar harfe düşebiliyordu. */
  try{ await initIcons(); }catch(e){}
  try{ await loadApps(); }catch(e){ APP_ERR = e.message || String(e); }
  /* v2.7 DUZELTME: v2.6'da cihaz bilgisi hic yuklenmiyordu (SYS bos kaliyor,
     "Cihaz" sekmesi —/NaN dolu goruluyordu). Artik acilista okunur. */
  try{ await loadSys(); }catch(e){ SYS = {}; }
  await render();
  renderTabs();
  // onbellek 6 saatten eskiyse sessizce tazele (yeni kurulan uygulamalar gorunsun)
  const age = parseInt(ST.apps_age || "0", 10);
  if(age > 21600 && !busy){
    execRaw(SHELL + " " + SCRIPT + " apps-refresh").then(async ()=>{
      try{ await loadApps(); await loadStatus(); renderTabs(); }catch(e){}
    }).catch(()=>{});
  }
  if(AUTO){
    pollTimer = setInterval(async ()=>{
      if(busy || document.hidden || TAB === "kayitlar") return;
      try{
        await loadStatus();
        renderTabs();
        if(TAB === "durum"){
          const v = $("view");
          const y = window.scrollY;
          if(v && !document.querySelector("input:focus,textarea:focus")){
            v.innerHTML = viewDurum();
            window.scrollTo(0, y);
          }
        }
      }catch(e){}
    }, 15000);
  }
})();

</script>

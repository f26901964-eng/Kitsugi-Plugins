# ============================================================
#  Force Landscape - All Apps   v2.7.1  |  yapilandirma
#  Konum: /data/adb/force_landscape/config.conf
#  Degisiklikten sonra: yoneticide modulun "Action" dugmesine bas
#  ya da cihazi yeniden baslat.
#  NOT: v1.8 eski config dosyasini silmez; eksik anahtarlari ekler
#  (yedek: config.conf.bak).
# ============================================================

# ---- MOD ---------------------------------------------------
# auto   = once sensor modunu dener; ROM uygulama yon istegini yok saymiyorsa
#          otomatik GARANTILI KILIT moduna gecer.
# sensor = uygulama kilidi yok sayilir + ekran sensoru serbest
# lock   = ekran tek yatay aciya kilitlenir (sensor kapali, en garantili)
# off    = modul yone hic karismaz (ignore-orientation kapali, sensor acik)
ROTATION_MODE=auto
AUTO_LANDSCAPE=true
ROTATION=1

# ---- LETTERBOX (ortada portre kutu) COZUMU -----------------
COMPAT_FORCE_RESIZE=true

# smart     = SADECE dikey calisan / henuz bilinmeyen uygulamalara uygula.
# whitelist = SADECE force.txt icindeki uygulamalara uygula (WebUI: "Yatay")
# all       = oyun listesi ve never.txt haric herkese uygula
# off       = letterbox cozumu kapali (yon katmani calismaya devam eder)
#         Kendi kendine yatay calisan uygulamalara (oyunlar, video
#         oynaticilar) DOKUNULMAZ -> zorla resize kaynakli cokme riski yok.
# all   = butun uygulamalara uygula (en saldirgan; oyunlarda risk).
# off   = letterbox cozumu kapali.
COMPAT_MODE=smart

# Uygulamalarin istedigi yonu "dumpsys activity" uzerinden ogren.
# (Kullanilan uygulamalarin yonu bir kez kaydedilir, kalici dosyada tutulur.)
LEARN_ORIENTATION=true

# Android 13 icin FORCE_RESIZE_APP change id'si
COMPAT_ID=174042936

# Tur basina en fazla saniye (boot'u bekletmez)
COMPAT_BUDGET=120

# Bir turda SURE DOLSA BILE en az bu kadar paket islenir (v1.9).
# v1.7'de butce ilk pakette dolabiliyordu ve hicbir sey uygulanmiyordu.
COMPAT_MIN_PER_TURN=8

# am compat yolu bu ROM'da calismazsa, bir sonraki acilista
# /data/misc/appcompat/compat_framework_overrides.xml dosyasina
# dogrudan yazilsin mi?  auto = yalnizca am yolu calismazsa
COMPAT_XML_FALLBACK=auto

# Sistem uygulamalarina da uygulansin mi
COMPAT_INCLUDE_SYSTEM=false

# Dokunulmayacak paketler (boslukla ayrilmis)
COMPAT_EXCLUDE="android com.android.systemui com.android.permissioncontroller com.google.android.permissioncontroller com.android.shell com.miui.home"

# Listeye ek olarak zorlanacak paketler (ornek):
# EXTRA_PACKAGES="com.example.app"
EXTRA_PACKAGES=""

# Global "resizeable" ayari. Android bunu SADECE acilista okur.
FORCE_RESIZABLE=true

# ---- DIGER -------------------------------------------------
IGNORE_ORIENTATION=true
SETTINGS_FALLBACK=true
REAPPLY_AT="0 8 20 45"
DRY_RUN=false
RESTART_SYSTEMUI=false
DISPLAYS=0
MAKE_REPORT=true
LOG=1

# v2.8 — MIUI ORTA-PENCERE (activity embedding)  [v2.18: varsayilan DEGISTI]
# MIUI Pad, "uyumlu degil" saydigi uygulamalari ekranin ORTASINDA dar bir
# pencereye koyar (siyah yan bantlar). true = motoru kapat (tam ekran).
# DIKKAT: bu motor KAPALIYKEN uygulamaya ozel yatay kurallari
# (embedded_rules_list / fixed_orientation_list) CALISMAZ; cunku onlari
# isleyen servis budur. Orta-pencere sorununu artik uygulama bazinda
# "mailbox kapat" cozuyor. Bu anahtari true yaparsan ve force.txt'te
# uygulama varsa, acilis betigi motoru yine de ACAR (log yazar).
#   ro.config.miui_activity_embedding_enable=false
MIUI_NO_EMBEDDING=false

# v2.10 — TAM EKRAN IZLEYICISI
# Oyun/uugulama acildiginda gorevini ekran olcusune getirir
# (MIUI orta-pencereyi calisma aninda ezer -> saga-sola yapisir).
# Pil/CPU etkisi cok dusuk: 3 sn'de bir tek dumpsys.
WATCH_FULLSCREEN=true

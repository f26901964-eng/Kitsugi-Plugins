 html,body {background: #000; width: 100%; height: 100%;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";-webkit-font-smoothing: subpixel-antialiased;}
 * {margin: 0; padding: 0;-webkit-font-smoothing: subpixel-antialiased;}
 #player {height: 100% !important; width: 100% !important;}
 
 .jw-settings-submenu-audioTracks .jw-reset.jw-settings-submenu-items:before,
 .jw-settings-submenu-captions .jw-reset.jw-settings-submenu-items:before,
 .jw-settings-submenu-playbackRates .jw-reset.jw-settings-submenu-items:before,
 .jw-settings-submenu-quality .jw-reset.jw-settings-submenu-items:before {
 color: #fff;
 font-weight: bold;
 padding: 10px;
 display: block;
 }
 .jw-settings-submenu-audioTracks .jw-reset.jw-settings-submenu-items:before {
 content: 'Seslendirme';
 }
 .jw-settings-submenu-captions .jw-reset.jw-settings-submenu-items:before {
 content: 'Altyazı';
 }
 .jw-settings-submenu-playbackRates .jw-reset.jw-settings-submenu-items:before {
 content: 'Oynatma Hızı';
 }
 .jw-settings-submenu-quality .jw-reset.jw-settings-submenu-items:before {
 content: 'Kalite';
 }
 .jw-settings-submenu-items {
 flex: 1;
 }
 .jw-settings-submenu.jw-settings-submenu-active {
 display: flex !important;
 flex-direction: column-reverse;
 }

 .jw-breakpoint-4 .jw-settings-menu,
 .jw-breakpoint-3 .jw-settings-menu {
 height: 250px !important;
 max-height: 250px !important;
 }

 .jw-settings-topbar .jw-settings-topbar-buttons {
 display: flex;
 }

 .jw-settings-quality.jw-submenu-quality {
 order: 3;
 }
 .jw-settings-captions.jw-submenu-captions {
 order: 2;
 }
 .jw-settings-playbackRates.jw-submenu-playbackRates {
 order: 4;
 }
 .jw-settings-audioTracks.jw-submenu-audioTracks {
 order: 1;
 }
 .jw-settings-close {
 order: 5;
 }
 
 .jwplayer .jw-rightclick.jw-open { display:none !important; }

 /* ileri sarma butonu yalnizca masaustunde gosterilsin (mobilde zaten var, cift olmasin) */
 @media (max-width: 768px) {
 #forward-btn { display: none !important; }
 }

 .btn-warning {
 color: #111;
 background-color: #ffc107;
 border-color: #ffc107;
 }
 .btn-warning:hover {
 background: #ffdf6d;
 }
 .btn {
 font: 15px Tahoma;
 margin-top: 3px;
 margin-bottom: 5px;
 padding: 2px 5px;
 text-decoration: none;
 }
 .btn {
 display: inline-block;
 font-weight: 400;
 text-align: center;
 white-space: nowrap;
 vertical-align: middle;
 -webkit-user-select: none;
 -moz-user-select: none;
 -ms-user-select: none;
 user-select: none;
 border: 1px solid transparent;
 padding: .375rem .75rem;
 font-size: 1rem;
 line-height: 1.5;
 border-radius: .25rem;
 transition: background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
 }

 .btn-download {
 position: absolute;
 top: 10px;
 right: 10px;
 z-index: 2;
 }
 
 .btn-help {
 position: absolute;
 top: 10px;
 right: 80px;
 z-index: 2;

 color: #fff;
 background-color: #dc3545;
 border-color: #dc3545;
 }
 .btn-help:hover { background:#c82333 }

 .btn-vip {
 position: absolute;
 top: 10px;
 right: 170px;
 z-index: 2;

 color: #1a1203;
 background: linear-gradient(135deg, #ffd700 0%, #ffb300 35%, #ff8f00 70%, #ff6f00 100%);
 border: 2px solid #fff3b0;
 font-weight: bold;
 box-shadow: 0 0 18px rgba(255, 193, 7, 0.75), 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
 animation: btn-vip-pulse 1.6s ease-in-out infinite;
 text-decoration: none;
 transition: transform .15s ease, box-shadow .15s ease;
 }
 .btn-vip:hover {
 color: #1a1203;
 transform: scale(1.06);
 background: linear-gradient(135deg, #fff3b0 0%, #ffd700 40%, #ff8f00 100%);
 box-shadow: 0 0 30px rgba(255, 215, 0, 1), 0 4px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.6);
 animation: none;
 }
 .btn-vip .vip-star {
 display: inline-block;
 margin-right: 4px;
 animation: btn-vip-star 1.2s linear infinite;
 }
 @keyframes btn-vip-pulse {
 0%, 100% { box-shadow: 0 0 14px rgba(255, 193, 7, 0.6), 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.5); }
 50%      { box-shadow: 0 0 28px rgba(255, 235, 59, 0.95), 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.6); }
 }
 @keyframes btn-vip-star {
 0%, 100% { transform: rotate(0deg) scale(1); }
 50%      { transform: rotate(18deg) scale(1.15); }
 }
 @media (max-width: 768px) {
 .btn-vip {
 right: 165px;
 }
 }

 /* Geçici duyuru bandı (DC arıza vb.) */
 .player-notice {
 position: absolute;
 top: 10px;
 right: 170px;
 z-index: 2;

 color: #1a1203;
 background: linear-gradient(135deg, #ffeb3b 0%, #ffc107 50%, #ff9800 100%);
 border: 2px solid #fff;
 font-weight: bold;
 padding: .375rem .75rem;
 font-size: 14px;
 line-height: 1.5;
 border-radius: .25rem;
 box-shadow: 0 0 14px rgba(255, 152, 0, 0.7), 0 4px 14px rgba(0,0,0,0.5);
 animation: player-notice-blink 1.5s ease-in-out infinite;
 white-space: nowrap;
 }
 @keyframes player-notice-blink {
 0%, 100% { box-shadow: 0 0 14px rgba(255, 152, 0, 0.7), 0 4px 14px rgba(0,0,0,0.5); }
 50%      { box-shadow: 0 0 28px rgba(244, 67, 54, 0.95), 0 4px 14px rgba(0,0,0,0.5); }
 }
 @media (max-width: 768px) {
 .player-notice {
 top: 55px;
 right: 10px;
 left: 10px;
 font-size: 11px;
 padding: .3rem .5rem;
 white-space: normal;
 text-align: center;
 }
 }

 .btn-sm {
 padding: .25rem .5rem;
 font-size: .875rem;
 border-radius: .2rem;
 }

 .btn-outline {
 color: #cacaca;
 background-color: transparent;
 border-color: #cacaca;
 }
 .btn-outline:hover {
 color: #fff;
 border-color: #fff;
 }

 .label {
 padding: 2px 6px;
 }

 .video-presets {
 position: absolute;
 bottom: 100%;
 z-index: 9;
 }

 /* tooltip bilgilendirme */
 .tooltip-info {
 width: 200px;
 background: #1f2022;
 cursor: pointer;
 color: #fff;
 border-radius: 5px;
 padding: 10px 12px;
 position: absolute;
 z-index: 9999;
 bottom: 60px;
 font-size: 13px !important;
 line-height: 1.4;
 box-shadow: 0 4px 14px rgba(0,0,0,0.5);
 animation: tooltip-fadein 0.35s ease-out;
 }
 .tooltip-info::after {
 content: "";
 position: absolute;
 top: 100%;
 left: 50%;
 margin-left: 42px;
 border-width: 6px 5px 0 5px;
 border-style: solid;
 border-color: #1f2022 transparent transparent transparent;
 }
 .tooltip-info .fl {
 display: inline-block;
 width: calc(100% - 20px);
 vertical-align: top;
 }
 .tooltip-info i {
 float: right;
 font-weight: bold;
 font-style: normal;
 padding: 0 4px;
 opacity: 0.7;
 cursor: pointer;
 }
 .tooltip-info i:hover { opacity: 1; }
 .tooltip-info.dual-info { right: 160px; }
 .tooltip-info.sub-info { right: 110px; display: none; }
 @keyframes tooltip-fadein {
 from { opacity: 0; transform: translateY(6px); }
 to   { opacity: 1; transform: translateY(0); }
 }
 @media (max-width: 768px) {
 .tooltip-info { width: 160px; font-size: 11px !important; padding: 6px 10px; bottom: 55px; }
 .tooltip-info.dual-info { right: 175px; }
 .tooltip-info.sub-info  { right: 130px; }
 }

 @media (max-width: 768px) {
 .hidden-xs {
 display: none !important;
 }
 .btn-sm {
 padding: .10rem .3rem;
 font-size: .625rem;
 }
 }

 .jw-flag-user-inactive .btn-download, .jw-flag-user-inactive .btn-help, .jw-flag-user-inactive .btn-vip, .jw-flag-user-inactive .player-notice {
 display: none;
 }

 .jw-breakpoint-2 .jw-settings-open.jw-controls, .jw-flag-small-player .jw-settings-open.jw-controls, .jw-flag-touch .jw-settings-open.jw-controls
 {
 z-index: 3 !important;
 }

 function initVisibilityChecker(jwPlayer) {
 let visible = true;
 let isIosFullscreen = false;

 const update = () => { visible = document.visibilityState === "visible"; };
 document.addEventListener("visibilitychange", update);
 window.addEventListener("pagehide", () => (visible = false));
 window.addEventListener("pageshow", () => (visible = true));

 const container = jwPlayer?.getContainer?.();
 const videoEl = container?.querySelector?.("video");
 if (videoEl) {
 videoEl.addEventListener("webkitbeginfullscreen", () => { isIosFullscreen = true; });
 videoEl.addEventListener("webkitendfullscreen", () => { isIosFullscreen = false; });
 }
 update();

 const isActuallyFullscreen = () => {
 if (!jwPlayer) return false;
 if (videoEl?.webkitDisplayingFullscreen || isIosFullscreen) return true;
 return jwPlayer.getFullscreen?.() === true || !!document.fullscreenElement;
 };

 return { isVisible: () => visible && isActuallyFullscreen() };
 }
